name: Apply GT19 interaction fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - general-training/shared/gt-reading-exam-guards.js
      - .github/workflows/apply-gt19-interaction-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gt19-interactions-and-shortcuts
          fetch-depth: 0

      - name: Load shared guard in IELTS 19 GT tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('general-training/cambridge-19/test-1/study-feedback.js'),
              Path('general-training/cambridge-19/test-2/study-feedback.js'),
              Path('general-training/cambridge-19/test-3/study-feedback.js'),
          ]
          line = "  document.write('<script src=\"../../shared/gt-reading-exam-guards.js\"><\\/script>');\n"
          anchor = "  document.write('<script src=\"../../../academic/shared/reading-feature-shell-core.js\"><\\/script>');\n"
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if line not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit(f'Unique shared-core anchor not found in {path}')
                  text = text.replace(anchor, anchor + line, 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Static contract checks
        shell: bash
        run: |
          node --check general-training/shared/gt-reading-exam-guards.js
          for f in general-training/cambridge-19/test-{1,2,3}/study-feedback.js; do
            node --check "$f"
            grep -q '../../shared/gt-reading-exam-guards.js' "$f"
          done
          python - <<'PY'
          from pathlib import Path
          html = Path('general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html').read_text(encoding='utf-8')
          assert 'aria-label="Drag answers for questions 1 to 8"' in html
          assert 'aria-label="Drag answers for questions 9 to 14"' in html
          for q in range(1, 15):
              assert f'name="q{q}"' in html
              assert f'data-for="q{q}"' in html
          print('Test 3 Section 1 drag-and-drop source contract: PASS')
          PY

      - name: Browser interaction regression
        shell: bash
        run: |
          npm install --prefix /tmp/gt19-interactions --no-save puppeteer-core@24.16.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          cat > /tmp/gt19-interactions.js <<'NODE'
          const puppeteer = require('/tmp/gt19-interactions/node_modules/puppeteer-core');
          const assert = require('assert');
          (async () => {
            const browser = await puppeteer.launch({executablePath: process.env.CHROME_BIN, headless: true, args:['--no-sandbox']});
            const files = [
              'general-training/cambridge-19/test-1/IELTS19%20Test%201%20-%20Reading%20-%20GT.html',
              'general-training/cambridge-19/test-2/IELTS19%20Test%202%20-%20Reading%20-%20GT.html',
              'general-training/cambridge-19/test-3/IELTS19%20Test%203%20-%20Reading%20-%20GT.html'
            ];
            for (const file of files) {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:8765/' + file, {waitUntil:'networkidle0'});
              await page.click('[data-mode="study"]');
              await page.waitForFunction(() => document.querySelector('.logo.home-link, .logo-link'));
              const logo = await page.evaluate(() => {
                const el = document.querySelector('.logo.home-link, .logo-link');
                return {cursor:getComputedStyle(el).cursor, role:el.getAttribute('role'), tabIndex:el.tabIndex};
              });
              assert.strictEqual(logo.cursor, 'pointer');
              assert(logo.role === 'link' || logo.role === null);
              assert(logo.tabIndex >= 0);
              const guard = await page.evaluate(() => ({toast:Boolean(document.getElementById('shortcutToast')), installed:document.documentElement.dataset.gtFindGuard}));
              assert.deepStrictEqual(guard, {toast:true, installed:'true'});
              await page.close();
            }

            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8765/' + files[2], {waitUntil:'networkidle0'});
            await page.click('[data-mode="study"]');
            const drag = await page.evaluate(() => ({
              banks: document.querySelectorAll('#questionContent > [data-section="1"] .drag-bank').length,
              hiddenSelects: [...document.querySelectorAll('#questionContent > [data-section="1"] select[name^="q"]')].filter(s => s.classList.contains('sr-only')).length,
              zones: document.querySelectorAll('#questionContent > [data-section="1"] .drop-zone').length,
              clearButtons: document.querySelectorAll('#questionContent > [data-section="1"] .gt-section1-clear, #questionContent > [data-section="1"] .clear-drop-btn').length
            }));
            assert.deepStrictEqual(drag, {banks:2, hiddenSelects:14, zones:14, clearButtons:14});
            await page.evaluate(() => {
              window.startTest('test');
              isTestRunning = true;
              testSubmitted = false;
            });
            await page.keyboard.down('Control');
            await page.keyboard.press('f');
            await page.keyboard.up('Control');
            await page.waitForFunction(() => document.getElementById('shortcutToast').classList.contains('visible'));
            const message = await page.$eval('#shortcutToast', el => el.textContent);
            assert.strictEqual(message, 'Find (CTRL + F) is disabled in Test mode.');
            await page.close();
            await browser.close();
            console.log('GT19 interaction browser regression: PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-interactions.js

      - name: Commit tested files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-gt19-interaction-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add general-training/shared/gt-reading-exam-guards.js \
                  general-training/cambridge-19/test-1/study-feedback.js \
                  general-training/cambridge-19/test-2/study-feedback.js \
                  general-training/cambridge-19/test-3/study-feedback.js \
                  .github/workflows/apply-gt19-interaction-fixes.yml
          git commit -m 'Fix GT19 Reading interactions and test shortcuts'
          git push origin HEAD:agent/fix-gt19-interactions-and-shortcuts
