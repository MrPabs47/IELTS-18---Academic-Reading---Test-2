name: Refresh GT19 Reading reference fingerprints

on:
  push:
    branches:
      - fix/gt19-reading-low-score-parity
    paths:
      - .gt19-reading-fingerprints/READY

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-reading-low-score-parity
      - name: Refresh only validated GT19 Reading reference blobs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hub/live-hub-contract.json')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'eb4394a47dad9ba1da8b64c17fbb4e353b3cc2d7': '14b4aafe341d0d20d28723e2736fde1562fcfc86',
              '99a3406e56a86ec7ba14e9dad6515974e55f97f1': '43dc3361ca26031b48df5236da249efa7abfe854',
              '4d1b1eb396dee1c9e94fa15c0d108b8b9332191b': '5ef70374f93e0e3407e786fd260562eeb7f8964f',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected fingerprint {old} exactly once, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/live-hub-contract.json
          git commit -m "Refresh validated GT19 Reading reference fingerprints"
          git push origin HEAD:fix/gt19-reading-low-score-parity
