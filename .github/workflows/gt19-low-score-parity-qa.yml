name: GT19 Reading low-score parity QA

on:
  push:
    branches:
      - fix/gt19-reading-low-score-parity
    paths:
      - .gt19-low-score-parity/RUN_QA

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-reading-low-score-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated QA dependencies
        run: |
          npm install --prefix /tmp/gt19-reading-playwright playwright@1.55.0
          npx --prefix /tmp/gt19-reading-playwright playwright install --with-deps chromium
          python -m pip install pytest
      - name: Run permanent low-score parity checks
        run: python -m pytest -q tests/gt19_reading_low_score_parity_test.py
      - name: Run browser low-score parity matrix
        env:
          NODE_PATH: /tmp/gt19-reading-playwright/node_modules
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/gt19-reading-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .gt19-low-score-parity/qa.cjs
