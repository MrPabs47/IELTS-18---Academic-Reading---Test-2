name: Publish GT Reading workflow package

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-docs:
    if: github.head_ref == 'docs/gt-reading-fast-track-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-fast-track-workflow
          fetch-depth: 0

      - name: Create canonical GT Reading documentation
        run: |
          mkdir -p general-training/shared
          cat <<'B64' | base64 -d | gzip -d > general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          
          B64
          cat <<'B64' | base64 -d | gzip -d > general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          
          B64

      - name: Validate and commit documentation only
        run: |
          test -s general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          test -s general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          grep -q 'showEvidenceText: false' general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          grep -q 'Fresh Study' general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          rm -f .github/workflows/publish-gt-reading-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md .github/workflows/publish-gt-reading-workflow.yml
          git commit -m "Add GT Reading fast-track workflow"
          git push origin HEAD:docs/gt-reading-fast-track-workflow
