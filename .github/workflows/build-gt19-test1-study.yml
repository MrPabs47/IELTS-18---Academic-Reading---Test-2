name: Finalise GT19 Test 1 Study Mode

on:
  push:
    branches: [agent/add-gt19-test1-study-mode]
    paths: [.github/workflows/build-gt19-test1-study.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt19-test1-study-mode
          fetch-depth: 0
      - name: Remove temporary build assets
        shell: bash
        run: |
          rm -rf .tmp/gt19-test1
          rm -f .github/workflows/build-gt19-test1-study.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean GT19 Test 1 build assets"
          git push origin HEAD:agent/add-gt19-test1-study-mode
