name: Build GT19 Test 1 Study Mode

on:
  push:
    branches:
      - agent/add-gt19-test1-study-mode
    paths:
      - .github/workflows/build-gt19-test1-study.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt19-test1-study-mode
          fetch-depth: 0

      - name: Reconstruct Study Mode assets
        shell: bash
        run: |
          python - <<'PYDATA'
          from pathlib import Path
          import base64,gzip
          source=Path('.tmp/gt19-test1')
          target=Path('general-training/cambridge-19/test-1')
          for prefix,name in [('data','study-feedback-data.js'),('bootstrap','study-feedback.js')]:
              encoded=''.join(path.read_text().strip() for path in sorted(source.glob(prefix+'-*.part')))
              (target/name).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PYDATA
          python - <<'PYPATCH'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/patch.py').write_bytes(gzip.decompress(base64.b64decode('')))
          PYPATCH
          python /tmp/patch.py

      - name: Validate JavaScript and content contract
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-1/study-feedback-data.js
          node --check general-training/cambridge-19/test-1/study-feedback.js
          python - <<'PYTEST'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/static.py').write_bytes(gzip.decompress(base64.b64decode('')))
          PYTEST
          python /tmp/static.py

      - name: Run browser lifecycle
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --prefix /tmp/gt19-browser --no-save puppeteer-core@24.16.0 >/dev/null
          python - <<'PYBROWSER'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/browser.js').write_bytes(gzip.decompress(base64.b64decode('')))
          PYBROWSER
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node /tmp/browser.js

      - name: Commit tested website files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html" \
                  general-training/cambridge-19/test-1/study-feedback.js \
                  general-training/cambridge-19/test-1/study-feedback-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Add IELTS 19 GT Test 1 Study mode"
            git push origin HEAD:agent/add-gt19-test1-study-mode
          fi
