name: Build GT19 Test 1 Study Mode

on:
  push:
    branches:
      - agent/add-gt19-test1-study-mode
    paths:
      - .github/workflows/build-gt19-test1-study.yml

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt19-test1-study-mode
          fetch-depth: 0

      - name: Write Study Mode assets
        shell: bash
        run: |
          python - <<'PYDATA'
          from pathlib import Path
          import base64, gzip
          root=Path('general-training/cambridge-19/test-1')
          payloads={'study-feedback-data.js':'','study-feedback.js':'H4sIAAuYaWoC/8087XLbyJH/9ynGSCoCyyRlkk7trrTalCzLXiday2dqU3clK1sgMCKxAgEGA0pm1qq6d8jfe4/8z6PkSa57vjAzGICknbq6qi2ZGHT39Nd09/QMNrxd53GVFjkJe+TXrwgJ1owSVpVpXAXHX8FAUsTrJc2r4UOZVjQ8+C5L8ztS0uwkYNUmo2xBaRWQRUlvT4Lh8FD8F8VR...TRUNCATED...'}
          for name,payload in payloads.items():
              (root/name).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PYDATA

      - name: Connect the Study Mode loader
        shell: bash
        run: |
          python - <<'PYPATCH'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/patch_gt19_test1_html.py').write_bytes(gzip.decompress(base64.b64decode('')))
          PYPATCH
          python /tmp/patch_gt19_test1_html.py

      - name: Validate JavaScript and content contract
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-1/study-feedback-data.js
          node --check general-training/cambridge-19/test-1/study-feedback.js
          python - <<'PYTEST'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/test_gt19_test1_static.py').write_bytes(gzip.decompress(base64.b64decode('')))
          PYTEST
          python /tmp/test_gt19_test1_static.py

      - name: Run browser lifecycle
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome executable not found" >&2
            exit 1
          fi
          npm install --prefix /tmp/gt19-browser --no-save puppeteer-core@24.16.0 >/dev/null
          python - <<'PYBROWSER'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/test_gt19_test1_browser.js').write_bytes(gzip.decompress(base64.b64decode('')))
          PYBROWSER
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node /tmp/test_gt19_test1_browser.js

      - name: Commit tested website files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html" \
                  general-training/cambridge-19/test-1/study-feedback.js \
                  general-training/cambridge-19/test-1/study-feedback-data.js
          if git diff --cached --quiet; then
            echo "No website changes to commit"
          else
            git commit -m "Add IELTS 19 GT Test 1 Study mode"
            git push origin HEAD:agent/add-gt19-test1-study-mode
          fi
