name: Assemble GT19 Test 2 Study Mode

on:
  push:
    branches:
      - agent/add-gt19-test2-study-mode
    paths:
      - .github/workflows/assemble-gt19.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified website files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          source = Path('.transfer/gt19')
          outputs = [
              (
                  sorted(source.glob('html.*.part')),
                  Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
                  '6f8bf324525c32c50cd8be6cdfab5c468c4477932b1d8202cc79a48aa7d5a890',
              ),
              (
                  sorted(source.glob('feedback.*.part')),
                  Path('general-training/cambridge-19/test-2/study-feedback.js'),
                  '675b367644d99e33306096b0861e504e5f216c61ae16e37ea1fd3bd7fa8d55b9',
              ),
          ]

          for chunks, destination, expected_sha256 in outputs:
              if not chunks:
                  raise SystemExit(f'No transfer chunks found for {destination}')
              encoded = ''.join(chunk.read_text().strip() for chunk in chunks)
              data = gzip.decompress(base64.b64decode(encoded))
              actual_sha256 = hashlib.sha256(data).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f'Integrity check failed for {destination}: '
                      f'{actual_sha256} != {expected_sha256}'
                  )
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              print(f'Wrote {destination} ({len(data)} bytes, SHA-256 {actual_sha256})')
          PY

      - name: Commit only final website files
        shell: bash
        run: |
          rm -rf .transfer/gt19
          rm -f .github/workflows/assemble-gt19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add GT19 Test 2 Study mode parity"
          git push origin HEAD:agent/add-gt19-test2-study-mode
