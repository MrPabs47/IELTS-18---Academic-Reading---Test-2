name: Validate GT19 Test 3 Aha feedback

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/validate-gt19-test3-aha-pr.yml
      - .tmp/gt19-test3-aha/**

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-gt19-test3-aha-feedback
          fetch-depth: 0

      - name: Reconstruct reviewed feedback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path('.tmp/gt19-test3-aha').glob('payload-*.txt'))
          if len(parts) != 4:
              raise SystemExit(f'Expected 4 payload chunks, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          content = gzip.decompress(base64.b64decode(encoded))
          expected = 'f07a9812995adb32b21e42eee3ec08dcb180ef3f33c5ffa5d0c2c6ad95d77f0b'
          actual = hashlib.sha256(content).hexdigest()
          if actual != expected:
              raise SystemExit(f'Payload hash mismatch: {actual}')

          target = Path('general-training/cambridge-19/test-3/study-feedback-data.js')
          target.write_bytes(content)

          bootstrap = Path('general-training/cambridge-19/test-3/study-feedback.js')
          text = bootstrap.read_text(encoding='utf-8')
          needle = '        completeClueCoverage: true,\n'
          addition = '        showEvidenceText: false,\n'
          if addition not in text:
              if text.count(needle) != 1:
                  raise SystemExit('Could not locate the unique clue-coverage setting')
              text = text.replace(needle, needle + addition, 1)
          bootstrap.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and static contract
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-3/study-feedback-data.js
          node --check general-training/cambridge-19/test-3/study-feedback.js

          node - <<'NODE'
          const fs = require('fs');
          global.window = {};
          require('./general-training/cambridge-19/test-3/study-feedback-data.js');
          fs.writeFileSync('/tmp/gt19-test3-data.json', JSON.stringify(window.IELTS19GTTest3StudyFeedback));
          NODE

          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('general-training/cambridge-19/test-3')
          html = (root / 'IELTS19 Test 3 - Reading - GT.html').read_text(encoding='utf-8')
          bootstrap = (root / 'study-feedback.js').read_text(encoding='utf-8')
          data = json.loads(Path('/tmp/gt19-test3-data.json').read_text(encoding='utf-8'))
          questions = data['questions']
          assert set(map(int, questions)) == set(range(1, 41))
          assert data['version'] == 2
          assert 'completeQuestionCoverage: true' in bootstrap
          assert 'completeClueCoverage: true' in bootstrap
          assert 'showEvidenceText: false' in bootstrap

          match = re.search(r'const answerKey\s*=\s*\{(.*?)\n\s*\};', html, re.S)
          assert match, 'Page answer key not found'
          page_key = {int(q): answer for q, answer in re.findall(r'(\d+)\s*:\s*"([^"]+)"', match.group(1))}
          assert len(page_key) == 40
          allowed_roots = {'#text-s1-films', '#text-s1-sports', '#text-s2-redundancy', '#text-s2-restaurant', '#text-s3-women'}
          for q in range(1, 41):
              record = questions[str(q)]
              assert record['answer'].casefold() == page_key[q].casefold(), f'Q{q} answer mismatch'
              assert record['explanation'].strip(), f'Q{q} Why missing'
              assert record['skill'].strip(), f'Q{q} Skill missing'
              assert record['evidence'].strip(), f'Q{q} clue missing'
              assert record['evidenceRoot'] in allowed_roots, f'Q{q} invalid root'
          covered = [q for group in data['taskGroups'] for q in group['questions']]
          assert sorted(covered) == list(range(1, 41)) and len(covered) == len(set(covered))
          print('Static Test 3 Aha contract: PASS')
          PY

      - name: Run browser lifecycle regression
        shell: bash
        run: |
          npm install --prefix /tmp/gt19-test3-browser --no-save puppeteer-core@24.16.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-test3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > /tmp/gt19-test3-browser.js <<'NODE'
          const puppeteer = require('/tmp/gt19-test3-browser/node_modules/puppeteer-core');
          const assert = require('assert');

          (async () => {
          const url = 'http://127.0.0.1:8765/general-training/cambridge-19/test-3/IELTS19%20Test%203%20-%20Reading%20-%20GT.html';
          const browser = await puppeteer.launch({executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox']});

          async function openPage() {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto(url, {waitUntil: 'networkidle0'});
            return {page, errors};
          }

          try {
            const study = await openPage();
            await study.page.click('[data-mode="study"]');
            await study.page.waitForFunction(() => document.querySelectorAll('.reading-shell-study-feedback-card').length === 40);
            const summary = await study.page.evaluate(() => {
              const labels = [...document.querySelectorAll('.reading-shell-study-feedback-card dt')].map(n => n.textContent.trim());
              const records = window.IELTS19GTTest3StudyFeedback.questions;
              const norm = v => String(v || '').replace(/\s+/g, ' ').trim();
              const targetFailures = Object.entries(records).filter(([, r]) => {
                const root = document.querySelector(r.evidenceRoot);
                return !root || !norm(root.textContent).includes(norm(r.evidence));
              }).map(([q]) => Number(q));
              return {
                cards: document.querySelectorAll('.reading-shell-study-feedback-card').length,
                why: labels.filter(x => x === 'Why').length,
                skill: labels.filter(x => x === 'Skill').length,
                evidenceRows: labels.filter(x => x === 'Evidence').length,
                clues: document.querySelectorAll('.reading-shell-study-clue-button').length,
                enabledClues: [...document.querySelectorAll('.reading-shell-study-clue-button')].filter(b => !b.disabled).length,
                targetFailures,
                scoreGuide: Boolean(document.querySelector('.reading-shell-score-guide-button')),
                answerKey: Boolean(document.querySelector('.reading-shell-answer-key-button'))
              };
            });
            assert.deepStrictEqual(summary, {cards: 40, why: 40, skill: 40, evidenceRows: 0, clues: 40, enabledClues: 40, targetFailures: [], scoreGuide: true, answerKey: true});
            const failedClues = await study.page.evaluate(async () => {
              const failed = [];
              for (let q = 1; q <= 40; q++) {
                window.switchSection(q <= 14 ? 1 : q <= 27 ? 2 : 3);
                document.querySelectorAll('.reading-shell-study-clue-button')[q - 1].click();
                await new Promise(r => setTimeout(r, 180));
                if (!document.querySelector('.reading-shell-evidence-highlight[data-reading-shell-clue-questions~="' + q + '"]')) failed.push(q);
              }
              return failed;
            });
            assert.deepStrictEqual(failedClues, []);
            assert.deepStrictEqual(study.errors, []);
            await study.page.close();

            const test = await openPage();
            await test.page.click('[data-mode="test"]');
            await test.page.type('#studentNameInput', 'Automated Student');
            await test.page.click('#testStartScreen .mode-btn');
            await test.page.waitForFunction(() => getComputedStyle(document.getElementById('app')).display !== 'none');
            const fresh = await test.page.evaluate(() => ({
              cards: document.querySelectorAll('.reading-shell-study-feedback-card').length,
              clues: document.querySelectorAll('.reading-shell-study-clue-button').length,
              timer: getComputedStyle(document.getElementById('timerContainer')).display !== 'none'
            }));
            assert.deepStrictEqual(fresh, {cards: 0, clues: 0, timer: true});
            assert.deepStrictEqual(test.errors, []);
            await test.page.close();
            console.log('Browser Test 3 Aha lifecycle: PASS');
          } finally {
            await browser.close();
          }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-test3-browser.js

      - name: Commit tested Test 3 files and clean staging files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add general-training/cambridge-19/test-3/study-feedback-data.js general-training/cambridge-19/test-3/study-feedback.js
          git commit -m 'Refine IELTS 19 GT Test 3 Study feedback'
          rm -rf .tmp/gt19-test3-aha .github/workflows/validate-gt19-test3-aha-pr.yml
          git add -A
          git commit -m 'Clean Test 3 validation staging'
          git push origin HEAD:agent/refine-gt19-test3-aha-feedback
