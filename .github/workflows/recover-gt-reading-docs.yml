name: Recover GT Reading documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover-docs:
    if: github.head_ref == 'docs/gt-reading-fast-track-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-fast-track-workflow
          fetch-depth: 0

      - name: Restore canonical documentation
        run: |
          mkdir -p general-training/shared
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          old = Path('.github/workflows/publish-gt-reading-workflow.yml').read_text(encoding='utf-8')
          match = re.search(
              r'IELTS_GT_READING_FAST_TRACK_WORKFLOW\.md\n\s+([A-Za-z0-9+/=]+)\n\s+B64',
              old,
          )
          if not match:
              raise SystemExit('Could not recover the workflow document payload')
          data = gzip.decompress(base64.b64decode(match.group(1), validate=True))
          Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md').write_bytes(data)
