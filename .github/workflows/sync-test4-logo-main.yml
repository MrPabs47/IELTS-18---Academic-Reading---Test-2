name: Sync Test 4 logo fix with main

on:
  push:
    branches:
      - fix/gt19-test4-logo-animation
    paths:
      - .gt19-test4-logo-sync/READY

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-test4-logo-animation
          fetch-depth: 0
      - name: Merge current main into Test 4 logo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/gt19-test4-logo-animation
