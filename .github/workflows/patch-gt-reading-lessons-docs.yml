              '---\n\n## 2. Main causes of delay and the new rule for each',
              '#### Behaviour-regression references — Tests 3 and 4\n\nTests 3 and 4 are not new integration templates. Use them as regression references for submitted-review lifecycle, shared-dialog containment, low-score round-tripping, layout hygiene, logo navigation/animation and custom interaction locking. The expected product behaviour is the intersection of the validated Tests 1–4 set, not whichever individual file happens to be newest.\n\n',
              'behaviour reference note'
