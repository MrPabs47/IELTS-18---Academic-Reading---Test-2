name: Patch GT Reading Cambridge 19 lessons docs

on:
  push:
    branches:
      - docs/gt-reading-cambridge19-lessons
    paths:
      - .gt-reading-docs-patch/READY

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-cambridge19-lessons
      - name: Update GT Reading workflow and parity checklist
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          checklist_path = Path('general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md')
          workflow = workflow_path.read_text(encoding='utf-8')
          checklist = checklist_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def insert_before(text, marker, addition, label):
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              return text.replace(marker, addition + marker, 1)

          # Header/reference-set update.
          workflow = replace_once(
              workflow,
              '**Reference implementations:** Cambridge IELTS 19 General Training Reading Tests 1 and 2  \n**Core releases:** PR #379 and PR #381  \n**Stabilisation releases:** PR #387, PR #389 and PR #392  \n**Focused regression release:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment  \n**Current reference commit:** `94455b5135879d06e514388a2ba9341bb3273144`  \n**Prepared:** 2 August 2026  \n**Updated:** 6 August 2026',
              '**Reference implementations:** Cambridge IELTS 19 General Training Reading Tests 1–4  \n**Core releases:** PR #379 and PR #381  \n**Stabilisation releases:** PR #387, PR #389, PR #392 and PR #436  \n**Cambridge 19 parity lessons:** PR #442, PR #443, PR #449, PR #450, PR #454, PR #456, PR #458 and PR #462  \n**Current reference commit:** `a52f6f9e67059e5c337167bc9091efb6fce8adda`  \n**Prepared:** 2 August 2026  \n**Updated:** 8 August 2026',
              'workflow header'
          )

          workflow = replace_once(
              workflow,
              'Cambridge IELTS 19 General Training Reading Tests 1 and 2 established the first stable General Training Reading reference pair for the project. They now use the shared Academic Reading shell while preserving General Training terminology, section structure, scoring, multiple-text layouts and target-specific answer controls.',
              'Cambridge IELTS 19 General Training Reading Tests 1–4 now form the project’s behavioural reference set. Tests 1 and 2 established the integration patterns; Tests 3 and 4 exposed lifecycle, scoring, layout, matching and header/logo regressions that are now part of the required parity contract. All four use the shared Academic Reading shell while preserving General Training terminology, section structure, scoring, multiple-text layouts and target-specific answer controls.',
              'executive reference set'
          )

          workflow = replace_once(
              workflow,
              '- task-specific strategies;\n- Q1–40 Correct answer, Why and Skill feedback;',
              '- task-specific strategies that are visible in Study, hidden during an active Test and restored in submitted Test review;\n- Q1–40 Correct answer, Why and Skill feedback;',
              'executive strategy lifecycle'
          )

          workflow = replace_once(
              workflow,
              '- Test 1 and Test 2 used different integration shapes.\n',
              '- Test 1 and Test 2 used different integration shapes.\n- A shared CSS rule could visually override the HTML `hidden` state, making Study information controls appear during an active Test; a local workaround then hid them too long after submission.\n- Test 4 could submit successfully while failing to initialise review feedback because a numeric-only result parser did not accept the valid `Below 3` band label.\n- Test 4’s logo was clickable but lacked both the established hover animation and, at one stage, a defined home-navigation handler.\n- Hidden feedback-host wrappers in Test 1 contributed real padding and created a large empty gap even while their content was invisible.\n- Test 2 matching answer boxes could exist without working passage-side drag/click behaviour because the boxes were created after the interaction setup had already run.\n',
              'executive Cambridge19 lessons'
