          workflow = replace_once(
              workflow,
              '| Legacy submitted result | Older pages depended on DOM result compatibility | Prefer an authoritative snapshot; otherwise opt into the approved compatibility path explicitly and test it |\n',
              '| Legacy submitted result | Older pages depended on DOM result compatibility | Prefer an authoritative snapshot; otherwise opt into the approved compatibility path explicitly, including a `Below 3` round-trip test |\n| Mode-info lifecycle | CSS could override `hidden`, while a local workaround could remain active after submission | Verify Study visible → active Test hidden → submitted Test visible in the browser; do not rely on DOM `hidden` alone |\n| Matching initialisation | Answer boxes could be present after the interaction wiring had already run | Browser-test real drag, click-to-place, keyboard, repeated-letter reuse and Clear where supported |\n| Low-score feedback | Numeric-only parsing rejected the valid `Below 3` result | Current GT contract is 0–8 = `Below 3`; result overlay, parser and submitted feedback must all agree |\n| Logo parity | Navigation and animation were implemented separately in different tests | Verify route, leave warning, mouse/keyboard activation, hover animation and reduced-motion behaviour |\n| Empty feedback hosts | Hidden wrappers still contributed padding and produced dead vertical space | Hidden feedback hosts must contribute zero layout space until content is revealed |\n',
              'delay table new rows'
          )

          workflow = replace_once(
