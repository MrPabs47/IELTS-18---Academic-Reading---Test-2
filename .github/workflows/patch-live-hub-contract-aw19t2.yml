name: Patch Live Hub contract for Academic Writing 19-2

on:
  push:
    branches:
      - fix/live-hub-contract-academic-writing-19-2
    paths:
      - .live-hub-contract-aw19t2/READY

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-hub-contract-academic-writing-19-2
      - name: Align contract with published Academic Writing 19-2 route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hub/live-hub-contract.json')
          text = path.read_text(encoding='utf-8')
          old_availability = "academicWriting:new Set(['19-1','16-1','16-2','16-3','16-4','17-1','17-2','17-3','17-4','18-1','18-2','18-3','18-4'])"
          new_availability = "academicWriting:new Set(['19-1','19-2','16-1','16-2','16-3','16-4','17-1','17-2','17-3','17-4','18-1','18-2','18-3','18-4'])"
          old_excluded = '"excluded":["19-2","19-3","19-4"]'
          new_excluded = '"excluded":["19-3","19-4"]'
          if text.count(old_availability) != 1:
              raise SystemExit(f'Expected one old availability fragment, found {text.count(old_availability)}')
          if text.count(old_excluded) != 1:
              raise SystemExit(f'Expected one old exclusion fragment, found {text.count(old_excluded)}')
          text = text.replace(old_availability, new_availability, 1)
          text = text.replace(old_excluded, new_excluded, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/live-hub-contract.json
          git commit -m "Align Live Hub contract with Academic Writing 19-2"
          git push origin HEAD:fix/live-hub-contract-academic-writing-19-2
