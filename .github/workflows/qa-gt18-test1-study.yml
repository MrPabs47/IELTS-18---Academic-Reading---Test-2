name: QA IELTS 18 GT Test 1 Study integration

on:
  push:
    paths:
      - '.gt18-test1-qa-trigger'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ielts18-gt-test1-study-feedback
      - name: Install browser runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run browser parity QA
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/gt18-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat >/tmp/gt18-qa.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');

          const URL = 'http://127.0.0.1:8000/general-training/cambridge-18/test-1/IELTS18%20Test%201%20-%20Reading%20-%20GT.html';
          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          async function visibleCount(page, selector) {
            return page.locator(selector).evaluateAll(nodes => nodes.filter(node => {
              const style = getComputedStyle(node);
              return !node.hidden && style.display !== 'none' && style.visibility !== 'hidden' && node.getClientRects().length > 0;
            }).length);
          }
          async function openPage(browser, viewport) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });
            await page.goto(URL, { waitUntil: 'networkidle' });
            return { page, errors };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            // Desktop Study lifecycle and learning resources.
            {
              const { page, errors } = await openPage(browser, { width: 1440, height: 1000 });
              await page.locator('.mode-btn[data-mode="study"]').click();
              await page.waitForTimeout(300);
              const status = await page.evaluate(() => window.ReadingFeatureShell && ReadingFeatureShell.getStatus());
              assert(status && status.initialized, 'Study shell did not initialise');
              assert((await page.locator('.top-left .test-title').innerText()).includes('IELTS 18 General Training Reading Test 1'), 'Header title was not normalised');
              assert(await visibleCount(page, '#candidateNameDisplay') === 0, 'Candidate should not be visible in Study');
              const strategyCount = await visibleCount(page, '.reading-shell-study-icon-button');
              assert(strategyCount === 7, `Expected 7 Study strategy buttons, found ${strategyCount}`);
              const clueCount = await visibleCount(page, '.reading-shell-clue-button');
              assert(clueCount === 40, `Expected 40 Study clue buttons, found ${clueCount}`);
              assert(await visibleCount(page, '.reading-shell-score-guide-button') === 1, 'Score guide should be visible in Study');
              assert(await visibleCount(page, '.reading-shell-answer-key-button') === 1, 'Answer Key should be visible in Study');

              await page.locator('.reading-shell-score-guide-button').click();
              await page.waitForTimeout(100);
              const scoreDialog = page.locator('.reading-shell-score-guide-dialog');
              assert(await scoreDialog.isVisible(), 'Score guide dialog did not open');
              assert((await scoreDialog.innerText()).includes('Below 3'), 'Score guide is missing Below 3');
              await page.keyboard.press('Escape');

              await page.locator('.reading-shell-answer-key-button').click();
              await page.waitForTimeout(100);
              const answerDialog = page.locator('.reading-shell-answer-key-dialog');
              assert(await answerDialog.isVisible(), 'Answer Key dialog did not open');
              const answerText = await answerDialog.innerText();
              assert(answerText.includes('40') && answerText.includes('A'), 'Answer Key content is incomplete');
              await page.keyboard.press('Escape');

              await page.locator('.reading-shell-clue-button').first().click();
              await page.waitForTimeout(100);
              const highlighted = await page.locator('#text-s1-dry-cleaning').evaluate(root => {
                return Array.from(root.querySelectorAll('*')).some(node => /clue/i.test(node.className || '') && getComputedStyle(node).display !== 'none');
              });
              assert(highlighted, 'Q1 clue did not mark the dry-cleaning text');

              await page.locator('#primarySubmitBtn').click();
              await page.waitForTimeout(200);
              assert(await visibleCount(page, '.reading-shell-study-icon-button') === 7, 'Study strategies should remain visible after Study check');
              assert(await visibleCount(page, '.reading-shell-feedback-card') > 0, 'Study feedback cards did not appear after checking');
              assert(errors.length === 0, 'Desktop Study errors: ' + errors.join(' | '));
              console.log('PASS desktop Study lifecycle/resources');
              await page.close();
            }

            // Active Test, real matching, submission, Below 3 and locked review.
            {
              const { page, errors } = await openPage(browser, { width: 1440, height: 1000 });
              await page.evaluate(() => {
                studentName = 'QA Candidate Long Name For Header Truncation';
                startTest('test');
              });
              await page.waitForTimeout(300);
              assert(await visibleCount(page, '#candidateNameDisplay') === 1, 'Candidate should be visible in Test');
              assert((await page.locator('#candidateNameDisplay').innerText()).startsWith('Candidate: QA Candidate'), 'Candidate name is incorrect');
              assert(await visibleCount(page, '.reading-shell-study-icon-button') === 0, 'Study strategy buttons leaked into active Test');
              assert(await visibleCount(page, '.reading-shell-score-guide-button') === 0, 'Score guide leaked into active Test');
              assert(await visibleCount(page, '.reading-shell-answer-key-button') === 0, 'Answer Key leaked into active Test');
              assert(await visibleCount(page, '.reading-shell-clue-button') === 0, 'Clues leaked into active Test');

              assert(await page.locator('.passage-match-source').count() === 6, 'Expected 6 passage matching sources');
              assert(await page.locator('.drop-zone[data-for^="q"]').count() >= 7, 'Expected matching drop zones');
              assert(await page.locator('.gt-section1-clear').count() === 7, 'Expected 7 visible Clear controls for Q8–14');

              // click source A -> Q8
              await page.locator('.passage-match-source[data-value="A"]').click();
              await page.locator('.drop-zone[data-for="q8"]').click();
              assert(await page.locator('select[name="q8"]').inputValue() === 'A', 'Click-to-place did not write q8=A');

              // keyboard F -> Q9
              await page.locator('.drop-zone[data-for="q9"]').focus();
              await page.keyboard.press('f');
              assert(await page.locator('select[name="q9"]').inputValue() === 'F', 'Keyboard placement did not write q9=F');

              // repeated A -> Q10
              await page.locator('.drop-zone[data-for="q10"]').focus();
              await page.keyboard.press('a');
              assert(await page.locator('select[name="q10"]').inputValue() === 'A', 'Repeated-letter reuse did not write q10=A');

              // visible Clear -> Q8
              const q8Row = page.locator('.drop-zone[data-for="q8"]').locator('..');
              await q8Row.locator('.gt-section1-clear').click();
              assert(await page.locator('select[name="q8"]').inputValue() === '', 'Clear did not empty q8');

              // real drag source B -> Q8
              await page.locator('.passage-match-source[data-value="B"]').dragTo(page.locator('.drop-zone[data-for="q8"]'));
              assert(await page.locator('select[name="q8"]').inputValue() === 'B', 'Real drag did not write q8=B');

              page.once('dialog', dialog => dialog.accept());
              await page.locator('#primarySubmitBtn').click();
              await page.waitForTimeout(400);
              assert(await page.evaluate(() => testSubmitted === true), 'Test did not enter submitted state');
              assert((await page.locator('#bandLine').innerText()).includes('Below 3'), 'Low score did not display Below 3');
              await page.locator('#resultsCloseBtn').click();
              await page.waitForTimeout(300);

              assert(await visibleCount(page, '.reading-shell-study-icon-button') === 7, 'Strategies did not return in submitted Test review');
              assert(await visibleCount(page, '.reading-shell-score-guide-button') === 1, 'Score guide did not return in submitted Test review');
              assert(await visibleCount(page, '.reading-shell-answer-key-button') === 1, 'Answer Key did not return in submitted Test review');
              assert(await visibleCount(page, '.reading-shell-clue-button') === 40, 'Clues did not return in submitted Test review');
              assert(await page.locator('#primarySubmitBtn').isDisabled(), 'Primary submit was not locked');
              assert(await page.locator('.gt-section1-clear').evaluateAll(buttons => buttons.every(button => button.disabled)), 'Clear controls were not locked');
              assert(await page.locator('.passage-match-source').evaluateAll(items => items.every(item => item.draggable === false && item.getAttribute('aria-disabled') === 'true')), 'Matching sources were not locked');
              assert(await page.locator('.drop-zone[data-for="q8"]').getAttribute('aria-disabled') === 'true', 'Q8 drop zone was not locked');
              assert(await page.locator('select[name="q8"]').isDisabled(), 'Native q8 backing select was not locked');

              const frozenQ8 = await page.locator('select[name="q8"]').inputValue();
              await page.locator('.passage-match-source[data-value="A"]').click({ force: true }).catch(() => {});
              await page.locator('.drop-zone[data-for="q8"]').click({ force: true }).catch(() => {});
              assert(await page.locator('select[name="q8"]').inputValue() === frozenQ8, 'Submitted matching answer changed after lock');
              assert(errors.length === 0, 'Desktop Test errors: ' + errors.join(' | '));
              console.log('PASS active Test -> submitted locked review');
              await page.close();
            }

            // Narrow Study and dialogs.
            {
              const { page, errors } = await openPage(browser, { width: 390, height: 844 });
              await page.locator('.mode-btn[data-mode="study"]').click();
              await page.waitForTimeout(300);
              assert(await visibleCount(page, '.reading-shell-study-icon-button') === 7, 'Narrow Study strategy controls missing');
              await page.locator('.reading-shell-score-guide-button').click();
              await page.waitForTimeout(100);
              const scoreBox = await page.locator('.reading-shell-score-guide-dialog').boundingBox();
              assert(scoreBox && scoreBox.x >= -1 && scoreBox.x + scoreBox.width <= 391, 'Narrow Score guide overflows viewport');
              await page.keyboard.press('Escape');
              await page.locator('.reading-shell-answer-key-button').click();
              await page.waitForTimeout(100);
              const answerBox = await page.locator('.reading-shell-answer-key-dialog').boundingBox();
              assert(answerBox && answerBox.x >= -1 && answerBox.x + answerBox.width <= 391, 'Narrow Answer Key overflows viewport');
              await page.keyboard.press('Escape');
              assert(errors.length === 0, 'Narrow Study errors: ' + errors.join(' | '));
              console.log('PASS narrow Study/dialog containment');
              await page.close();
            }

            await browser.close();
            console.log('PASS IELTS 18 GT Reading Test 1 browser parity QA');
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          JS
          node /tmp/gt18-qa.cjs
