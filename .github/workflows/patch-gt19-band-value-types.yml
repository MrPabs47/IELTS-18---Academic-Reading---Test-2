name: Patch GT19 Reading band-value parity

on:
  push:
    branches:
      - fix/gt19-reading-low-score-parity
    paths:
      - .gt19-band-value-parity/READY

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-reading-low-score-parity
      - name: Align Test 1 and Test 3 band return types
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('general-training/cambridge-19')
          for number in (1, 3):
              path = root / f'test-{number}' / f'IELTS19 Test {number} - Reading - GT.html'
              text = path.read_text(encoding='utf-8')
              old = '''      if (correct === 40) return 9;\n      if (correct === 39) return 8.5;\n      if (correct >= 37) return 8;\n      if (correct >= 36) return 7.5;\n      if (correct >= 34) return 7;\n      if (correct >= 32) return 6.5;\n      if (correct >= 30) return 6;\n      if (correct >= 27) return 5.5;\n      if (correct >= 23) return 5;\n      if (correct >= 19) return 4.5;\n      if (correct >= 15) return 4;\n      if (correct >= 12) return 3.5;\n      if (correct >= 9) return 3;\n      return "Below 3";'''
              new = '''      if (correct === 40) return "9";\n      if (correct === 39) return "8.5";\n      if (correct >= 37) return "8";\n      if (correct >= 36) return "7.5";\n      if (correct >= 34) return "7";\n      if (correct >= 32) return "6.5";\n      if (correct >= 30) return "6";\n      if (correct >= 27) return "5.5";\n      if (correct >= 23) return "5";\n      if (correct >= 19) return "4.5";\n      if (correct >= 15) return "4";\n      if (correct >= 12) return "3.5";\n      if (correct >= 9) return "3";\n      return "Below 3";'''
              if text.count(old) != 1:
                  raise SystemExit(f'Test {number}: expected one numeric band table, found {text.count(old)}')
              text = text.replace(old, new, 1)
              text = text.replace('       * 6-8 = 2.5\n', '       * 0-8 = Below 3\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/cambridge-19/test-1/*.html general-training/cambridge-19/test-3/*.html
          git commit -m "Align GT19 Reading band value types"
          git push origin HEAD:fix/gt19-reading-low-score-parity
