name: Validate GT19 reading interactions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/validate-gt19-interactions.yml
      - general-training/shared/gt-reading-test-runtime.js
      - general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html
      - general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html
      - general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gt19-drag-logo-find
          fetch-depth: 0

      - name: Install shared runtime on GT19 tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html'),
              Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
              Path('general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html'),
          ]
          tag = '  <script src="../../shared/gt-reading-test-runtime.js"></script>\n'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if tag.strip() not in text:
                  if text.count('</body>') != 1:
                      raise SystemExit(f'{path}: expected one closing body tag')
                  text = text.replace('</body>', tag + '</body>', 1)
                  path.write_text(text, encoding='utf-8')

          runtime = Path('general-training/shared/gt-reading-test-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = '      if (selected) apply(zone, selected, record);\n      else if (zone.classList.contains("filled")) clear(zone);'
          new = '      if (selected) apply(zone, selected, record);\n      else if (selectedByBank.size > 0) return;\n      else if (zone.classList.contains("filled")) clear(zone);'
          if old in text:
              text = text.replace(old, new, 1)
              runtime.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Could not apply bank-isolation patch')
          PY

      - name: Validate static contract
        shell: bash
        run: |
          node --check general-training/shared/gt-reading-test-runtime.js
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html'),
              Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
              Path('general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert text.count('../../shared/gt-reading-test-runtime.js') == 1, path
          test3 = paths[2].read_text(encoding='utf-8')
          assert 'aria-label="Drag answers for questions 1 to 8"' in test3
          assert 'aria-label="Drag answers for questions 9 to 14"' in test3
          for q in range(1, 15):
              assert f'class="drop-zone" data-for="q{q}"' in test3
              assert f'class="sr-only" name="q{q}"' in test3
          print('Static GT19 interaction contract: PASS')
          PY

      - name: Run browser regression
        shell: bash
        run: |
          npm install --prefix /tmp/gt19-runtime-browser --no-save puppeteer-core@24.16.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-runtime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > /tmp/gt19-runtime-browser.js <<'NODE'
          const puppeteer = require('/tmp/gt19-runtime-browser/node_modules/puppeteer-core');
          const assert = require('assert');

          const base = 'http://127.0.0.1:8765/general-training/cambridge-19';
          const tests = [
            [1, `${base}/test-1/IELTS19%20Test%201%20-%20Reading%20-%20GT.html`],
            [2, `${base}/test-2/IELTS19%20Test%202%20-%20Reading%20-%20GT.html`],
            [3, `${base}/test-3/IELTS19%20Test%203%20-%20Reading%20-%20GT.html`]
          ];

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox']
            });

            async function open(url) {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(String(error)));
              page.on('console', message => {
                const text = message.text();
                if (message.type() === 'error' && !/404 \(File not found\)/.test(text) && !/Failed to load resource/.test(text)) errors.push(text);
              });
              await page.goto(url, {waitUntil: 'networkidle0'});
              return {page, errors};
            }

            async function startStudy(page) {
              await page.click('[data-mode="study"]');
              await page.waitForFunction(() => getComputedStyle(document.getElementById('app')).display !== 'none');
            }

            async function startTest(page) {
              await page.click('[data-mode="test"]');
              const name = await page.$('#studentNameInput');
              if (name) await page.type('#studentNameInput', 'Interaction Check');
              await page.click('#testStartScreen .mode-btn');
              await page.waitForFunction(() => getComputedStyle(document.getElementById('app')).display !== 'none');
            }

            for (const [number, url] of tests) {
              const study = await open(url);
              await startStudy(study.page);
              const logo = await study.page.evaluate(() => {
                const node = document.querySelector('.top-left .logo');
                return {
                  cursor: getComputedStyle(node).cursor,
                  role: node.getAttribute('role'),
                  tabindex: node.getAttribute('tabindex'),
                  title: node.getAttribute('title'),
                  runtime: Boolean(document.querySelector('script[src*="gt-reading-test-runtime.js"]'))
                };
              });
              assert.strictEqual(logo.cursor, 'pointer', `Test ${number} logo cursor`);
              assert.strictEqual(logo.role, 'link', `Test ${number} logo role`);
              assert.strictEqual(logo.tabindex, '0', `Test ${number} logo keyboard access`);
              assert.ok(/home/i.test(logo.title || ''), `Test ${number} logo title`);
              assert.strictEqual(logo.runtime, true, `Test ${number} runtime loaded`);

              const studyFind = await study.page.evaluate(() => {
                const event = new KeyboardEvent('keydown', {key: 'f', ctrlKey: true, bubbles: true, cancelable: true});
                return !document.dispatchEvent(event);
              });
              assert.strictEqual(studyFind, false, `Test ${number} keeps Find available in Study mode`);

              if (number === 3) {
                const dragSummary = await study.page.evaluate(() => ({
                  banks: document.querySelectorAll('.drag-bank').length,
                  sectionOneBanks: document.querySelectorAll('.drag-bank[aria-label*="questions 1 to 8"], .drag-bank[aria-label*="questions 9 to 14"]').length,
                  sectionOneZones: [...document.querySelectorAll('.drop-zone')].filter(zone => {
                    const q = Number(zone.dataset.for.replace('q', ''));
                    return q >= 1 && q <= 14;
                  }).length,
                  upgradedSources: document.querySelectorAll('.drag-item.passage-match-source').length
                }));
                assert.deepStrictEqual(dragSummary, {banks: 3, sectionOneBanks: 2, sectionOneZones: 14, upgradedSources: 16});

                await study.page.click('.drag-bank[aria-label*="questions 1 to 8"] .drag-item[data-value="A"]');
                await study.page.click('.drop-zone[data-for="q1"]');
                assert.strictEqual(await study.page.$eval('select[name="q1"]', el => el.value), 'A');

                await study.page.click('.drag-bank[aria-label*="questions 9 to 14"] .drag-item[data-value="B"]');
                await study.page.click('.drop-zone[data-for="q9"]');
                assert.strictEqual(await study.page.$eval('select[name="q9"]', el => el.value), 'B');

                await study.page.click('.drag-bank[aria-label*="questions 1 to 8"] .drag-item[data-value="C"]');
                await study.page.click('.drop-zone[data-for="q9"]');
                assert.strictEqual(await study.page.$eval('select[name="q9"]', el => el.value), 'B', 'Cross-bank selection must not affect another group');

                await study.page.focus('.drop-zone[data-for="q2"]');
                await study.page.keyboard.press('D');
                assert.strictEqual(await study.page.$eval('select[name="q2"]', el => el.value), 'D');

                const nativeDrag = await study.page.evaluate(() => {
                  const item = document.querySelector('.drag-bank[aria-label*="questions 1 to 8"] .drag-item[data-value="E"]');
                  const zone = document.querySelector('.drop-zone[data-for="q3"]');
                  const data = new DataTransfer();
                  item.dispatchEvent(new DragEvent('dragstart', {bubbles: true, cancelable: true, dataTransfer: data}));
                  zone.dispatchEvent(new DragEvent('dragover', {bubbles: true, cancelable: true, dataTransfer: data}));
                  zone.dispatchEvent(new DragEvent('drop', {bubbles: true, cancelable: true, dataTransfer: data}));
                  item.dispatchEvent(new DragEvent('dragend', {bubbles: true, cancelable: true, dataTransfer: data}));
                  return document.querySelector('select[name="q3"]').value;
                });
                assert.strictEqual(nativeDrag, 'E');
              }

              assert.deepStrictEqual(study.errors, [], `Test ${number} Study errors`);
              await study.page.close();

              const test = await open(url);
              await startTest(test.page);
              const findGuard = await test.page.evaluate(() => {
                const event = new KeyboardEvent('keydown', {key: 'f', ctrlKey: true, bubbles: true, cancelable: true});
                const prevented = !document.dispatchEvent(event);
                const toast = document.getElementById('shortcutToast');
                return {prevented, visible: toast.classList.contains('visible'), text: toast.textContent};
              });
              assert.strictEqual(findGuard.prevented, true, `Test ${number} blocks Ctrl+F`);
              assert.strictEqual(findGuard.visible, true, `Test ${number} shows shortcut message`);
              assert.ok(/disabled in Test mode/i.test(findGuard.text), `Test ${number} shortcut message`);

              if (number === 3) {
                await test.page.click('.drag-bank[aria-label*="questions 1 to 8"] .drag-item[data-value="A"]');
                await test.page.click('.drop-zone[data-for="q1"]');
                await test.page.evaluate(() => submitTest());
                await test.page.waitForFunction(() => document.querySelector('select[name="q1"]').disabled === true);
                const locked = await test.page.evaluate(() => ({
                  value: document.querySelector('select[name="q1"]').value,
                  sourceDraggable: document.querySelector('.drag-item.passage-match-source').draggable,
                  zoneLocked: document.querySelector('.drop-zone[data-for="q1"]').getAttribute('aria-disabled') === 'true'
                }));
                assert.deepStrictEqual(locked, {value: 'A', sourceDraggable: false, zoneLocked: true});
                await test.page.click('.drag-bank[aria-label*="questions 1 to 8"] .drag-item[data-value="B"]');
                await test.page.click('.drop-zone[data-for="q1"]');
                assert.strictEqual(await test.page.$eval('select[name="q1"]', el => el.value), 'A', 'Submitted drag answer remains locked');
              }

              assert.deepStrictEqual(test.errors, [], `Test ${number} Test errors`);
              await test.page.close();
            }

            await browser.close();
            console.log('GT19 drag, logo and Find regression: PASS');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-runtime-browser.js

      - name: Commit tested files and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/validate-gt19-interactions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            general-training/shared/gt-reading-test-runtime.js \
            "general-training/cambridge-19/test-1/IELTS19 Test 1 - Reading - GT.html" \
            "general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html" \
            "general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html" \
            .github/workflows/validate-gt19-interactions.yml
          git commit -m "Fix GT19 reading interactions"
          git push origin HEAD:agent/fix-gt19-drag-logo-find
