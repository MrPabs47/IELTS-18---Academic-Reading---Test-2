name: GT19 Reading Info Lifecycle QA

on:
  push:
    branches:
      - fix/gt-reading-info-control-lifecycle
    paths:
      - .gt19-info-lifecycle-qa/READY

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt-reading-info-control-lifecycle
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies outside repository
        run: |
          npm install --prefix /tmp/gt19-playwright playwright@1.55.0
          npx --prefix /tmp/gt19-playwright playwright install --with-deps chromium
          python -m pip install pytest

      - name: Run browser lifecycle QA
        shell: bash
        env:
          NODE_PATH: /tmp/gt19-playwright/node_modules
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/gt19-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .gt19-info-lifecycle-qa/qa.cjs

      - name: Run focused static regression test
        run: python -m pytest -q tests/gt_reading_info_control_lifecycle_test.py
