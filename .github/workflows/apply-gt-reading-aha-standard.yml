name: Apply GT Reading Aha standard

on:
  push:
    branches:
      - agent/add-gt-reading-aha-standard

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt-reading-aha-standard
          fetch-depth: 0

      - name: Add instructional clarity standard
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          checklist_path = Path('general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          text = workflow_path.read_text(encoding='utf-8')
          text = replace_once(text,
          '- A visible Evidence row was added even though the magnifying-glass highlight already showed the supporting passage text.\n- General Training sections contain multiple independent text roots, so Academic assumptions about one passage per section are unsafe.',
          '- A visible Evidence row was added even though the magnifying-glass highlight already showed the supporting passage text.\n- Some clue spans and Why/Skill explanations were technically correct but too compressed to resolve the learner\'s misunderstanding.\n- General Training sections contain multiple independent text roots, so Academic assumptions about one passage per section are unsafe.',
          'executive summary')
          text = replace_once(text,
          '**Use the shared Reading shell, but audit the General Training page as its own product. Do not treat it as Academic Reading with different text.**',
          '**Use the shared Reading shell, but audit the General Training page as its own product. Do not treat it as Academic Reading with different text, and do not treat technically correct feedback as sufficient unless it produces a clear learner \'aha\'.**',
          'central lesson')
          text = replace_once(text,
          '| Visible Evidence | Evidence text duplicated the highlighted passage | Keep evidence internally; show Correct answer, Why, Skill and the clue button only |\n| Multiple text roots',
          '| Visible Evidence | Evidence text duplicated the highlighted passage | Keep evidence internally; show Correct answer, Why, Skill and the clue button only |\n| Instructional clarity | Some clues and explanations were too short or generic to resolve the learner\'s exact misunderstanding | Apply the Aha test to every Q1–40 clue/Why/Skill trio; use the shortest wording that still makes the logic explicit |\n| Multiple text roots',
          'delay table')
          text = replace_once(text,
          '- concise Skill;\n- internal evidence target;',
          '- concise but instructionally resolving Skill;\n- internal evidence target with enough context to make the logic clear;',
          'question details')

          old = '''### 7.5 Skill standard

          Skill should be concise, specific and teachable, for example:

          - comparing time boundaries;
          - distinguishing a rule from an unstated consequence;
          - matching an absolute claim to a paraphrase;
          - predicting noun form from grammar;
          - separating a main idea from one example.

          ---
          '''
          new = '''### 7.5 Skill standard

          Skill should be concise, specific and teachable, for example:

          - comparing time boundaries;
          - distinguishing a rule from an unstated consequence;
          - matching an absolute claim to a paraphrase;
          - predicting noun form from grammar;
          - separating a main idea from one example.

          The Skill line must also tell the learner what to do differently next time. A label such as `scan for keywords` is not enough unless it identifies the decisive relationship the learner must compare.

          ### 7.6 Instructional resolution standard — the Aha test

          The clue, Why and Skill form one teaching sequence. Together they must move a learner from confusion to a clear understanding of both the answer and the reading move that produced it.

          #### Clue

          The highlighted clue must show the **minimum sufficient evidence span**:

          - include the decisive word or phrase;
          - include enough surrounding text to preserve the subject, action and logical relationship;
          - include a negation, qualifier, comparison, condition, cause, time marker or reference word when it changes the meaning;
          - do not highlight only the answer word or a fragment that forces the learner to infer the missing logic;
          - do not make the span unnecessarily broad.

          There is no fixed word count. The correct length is the shortest span that makes the evidence self-explanatory in context.

          #### Why

          Why must create an explicit reasoning bridge:

          1. identify the important wording or claim in the question;
          2. identify the matching, contrasting or missing information in the source;
          3. explain the logical relationship;
          4. state why that relationship produces the answer;
          5. where useful, name the likely distractor or misunderstanding.

          #### Skill

          Skill must convert the question-specific lesson into a reusable action. It should name the reading operation and the concrete feature to check next time, such as a time boundary, negation, degree word, pronoun reference, grammar fit or difference between a rule and an example.

          #### Pass/fail question

          A trio fails the Aha test when a plausible learner who chose the wrong answer could read it and still reasonably ask:

          - `But why is that the answer?`
          - `Which exact words changed the meaning?`
          - `What should I do differently on the next question?`

          Avoid vague endings such as `look carefully`, `scan for keywords`, `read the paragraph` or `the text says so` unless the explanation also identifies the exact relationship that matters.

          Generic example:

          - Weak clue: `after Monday`.
          - Clearer clue: `Applications received after Monday will not be considered.`
          - Weak Why: `The passage says the statement is false.`
          - Clearer Why: `The question says applications are accepted after Monday, but the text says applications received after Monday will not be considered. The time condition is opposite, so the statement is FALSE.`
          - Weak Skill: `Scan for keywords.`
          - Clearer Skill: `Compare the time marker and the rule attached to it; matching nouns do not help when after reverses the condition.`

          ---
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          text = replace_once(text, old, new, 'Aha section')
          text = replace_once(text,
          '- support shared evidence where several questions genuinely use the same phrase.',
          '- support shared evidence where several questions genuinely use the same phrase;\n- include the minimum sufficient context for the learner to understand the logic without reconstructing omitted words;\n- include decisive qualifiers, negation, comparison, condition, cause or time language when relevant;\n- avoid an isolated answer word or a misleadingly short fragment.',
          'exact target')
          text = replace_once(text,
          '- score guide;\n- target data validators.\n\nActivate complete coverage only after all targets resolve.',
          '- score guide;\n- target data validators;\n- a human Aha-test review of every Q1–40 clue/Why/Skill trio from the perspective of a plausible wrong-answer learner.\n\nActivate complete coverage only after all targets resolve and every trio is instructionally clear, not merely present.',
          'phase 3')
          text = replace_once(text,
          '| `test_gt_reading_testX_study_data.py` | Task groups, Q1–40 Correct answer/Why/Skill, visible Evidence suppression and score guide |',
          '| `test_gt_reading_testX_study_data.py` | Task groups, Q1–40 Correct answer/Why/Skill, visible Evidence suppression, score guide and structural completeness |',
          'test table')
          text = replace_once(text,
          'Add a new deep module only for a genuinely new question-control mechanism.',
          'Add a new deep module only for a genuinely new question-control mechanism. Automated checks can prove completeness and target resolution, but they cannot prove that a learner will understand the explanation; the all-40 Aha-test editorial review remains mandatory.',
          'testing note')
          text = replace_once(text,
          '| Showing an Evidence row and a passage highlight | Keep internal evidence; show clue button only |\n| Activating clues with partial data',
          '| Showing an Evidence row and a passage highlight | Keep internal evidence; show clue button only |\n| Highlighting only the answer word or an undersized fragment | Highlight the shortest complete evidence unit, including the decisive qualifier or relationship |\n| Why that merely repeats the answer | Bridge question wording to source wording and explain the conclusion |\n| Generic Skill such as `scan for keywords` | Name the reusable operation and the exact feature to compare next time |\n| Activating clues with partial data',
          'anti-patterns')
          text = replace_once(text,
          '- map exact internal evidence targets to the correct text roots;\n- set `showEvidenceText: false`;',
          '- map exact internal evidence targets to the correct text roots;\n- apply the Aha test to every clue/Why/Skill trio;\n- ensure each clue is the shortest complete evidence span, not simply the shortest possible span;\n- set `showEvidenceText: false`;',
          'runbook')
          text = replace_once(text,
          'Use Cambridge IELTS 19 General Training Reading Test 2 on current main as the preferred direct-integration reference and Test 1 as the legacy-adapter reference. The target test HTML, source files, answer key, accepted variants and evaluator remain authoritative for target-specific content.\n\nModel:',
          'Use Cambridge IELTS 19 General Training Reading Test 2 on current main as the preferred direct-integration reference and Test 1 as the legacy-adapter reference. The target test HTML, source files, answer key, accepted variants and evaluator remain authoritative for target-specific content.\n\nFor every question, make the clue, Why and Skill pass the Aha test: use the shortest complete evidence span, explicitly bridge question wording to source wording and conclusion, and give a reusable next-step reading action. Technically correct but vague or under-explained feedback does not pass.\n\nModel:',
          'prompt preamble')
          workflow_path.write_text(text, encoding='utf-8')

          text = checklist_path.read_text(encoding='utf-8')
          text = replace_once(text,
          '- [ ] Why explains question-specific text logic.\n- [ ] Skill is concise and actionable.',
          '- [ ] Every Q1–40 clue/Why/Skill trio passes the Aha test.\n- [ ] Why explicitly bridges question wording to source wording and then to the answer.\n- [ ] Why identifies the decisive contrast, paraphrase, missing detail or logical relationship.\n- [ ] Why addresses the likely distractor or misunderstanding where useful.\n- [ ] Skill is concise, actionable and tells the learner what to do differently next time.\n- [ ] Skill names the specific reading operation and the feature to check, not a generic instruction such as `look carefully` or `scan for keywords`.',
          'checklist feedback')
          text = replace_once(text,
          '- [ ] Every clue target resolves in the correct root.\n- [ ] Targets are distinctive',
          '- [ ] Every clue target resolves in the correct root.\n- [ ] Every clue highlights the minimum sufficient evidence span, not merely an isolated answer word.\n- [ ] Every clue includes enough context to preserve the subject, action and logical relationship.\n- [ ] Decisive negation, qualifier, comparison, condition, cause, time marker or reference word is included when relevant.\n- [ ] No hard clue-length target is used; clarity and logical completeness determine the span.\n- [ ] A learner can understand why the evidence matters without guessing the omitted context.\n- [ ] Targets are distinctive',
          'checklist clues')
          text = replace_once(text,
          '- [ ] Q1–40 detail validator passes.\n- [ ] Task-group coverage validator passes.',
          '- [ ] Q1–40 detail validator passes.\n- [ ] Human editorial review covers all 40 clue/Why/Skill trios.\n- [ ] The reviewer checks each trio from the perspective of a plausible learner who chose the wrong answer.\n- [ ] No trio leaves the reasonable questions `But why?`, `Which words matter?` or `What do I do next time?` unanswered.\n- [ ] Task-group coverage validator passes.',
          'checklist testing')
          text = replace_once(text,
          '- [ ] Representative early, middle and late clue buttons checked.\n- [ ] Section-level clue control checked',
          '- [ ] Representative early, middle and late clue buttons checked.\n- [ ] Highlighted clue spans are neither misleadingly short nor unnecessarily broad.\n- [ ] Section-level clue control checked',
          'checklist visual QA')
          checklist_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit documentation only
        run: |
          grep -q 'Instructional resolution standard — the Aha test' general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          grep -q 'minimum sufficient evidence span' general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          grep -q 'Every Q1–40 clue/Why/Skill trio passes the Aha test' general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          grep -q 'Human editorial review covers all 40' general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          rm .github/workflows/apply-gt-reading-aha-standard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md .github/workflows/apply-gt-reading-aha-standard.yml
          git commit -m 'Add GT Reading instructional clarity standard'
          test "$(git diff --name-only origin/main...HEAD | sort | paste -sd ',' -)" = 'general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md,general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md'
          git push origin HEAD:agent/add-gt-reading-aha-standard
