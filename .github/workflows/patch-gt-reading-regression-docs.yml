name: Patch GT Reading regression documentation

on:
  push:
    paths:
      - '.gt-reading-regression-docs-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-regression-lessons-2026-08-08
          fetch-depth: 0
      - name: Update GT Reading workflow and parity checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          checklist_path = Path('general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md')

          workflow = workflow_path.read_text(encoding='utf-8')
          checklist = checklist_path.read_text(encoding='utf-8')

          old = "**Focused regression release:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment  \n**Current reference commit:** `a52f6f9e67059e5c337167bc9091efb6fce8adda`  "
          new = "**Focused regression releases:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment; PR #473 — IELTS 18 GT Test 1 internal modal-overflow regression  \n**Current reference commit:** `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`  "
          if old not in workflow:
              raise SystemExit('Workflow metadata anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "> A shared Reading dialog is not verified merely because its button exists. Open and inspect every available Score guide, Answer Key and score-feedback dialog after any header, toolbar, mount or responsive CSS change."
          new = old + "\n>\n> The outer dialog fitting the viewport is not enough. For Score guide, Answer Key and score feedback, browser QA must verify the internal dialog/scroll/body/card chain has no unexpected horizontal overflow (`scrollWidth <= clientWidth + 1`), long feedback wraps, and headings remain inside the dialog."
          if old not in workflow:
              raise SystemExit('Workflow operating-rule anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "- A Test 3 header `white-space: nowrap` rule leaked into nested shared Reading dialogs, squeezing the Score guide until modal content was explicitly protected."
          new = old + "\n- IELTS 18 GT Test 1 exposed the same failure class in a subtler form: the outer modal still fitted the viewport, but a broad right-header `white-space: nowrap` rule was inherited by nested shell content, so the Score guide developed internal horizontal overflow and long score-feedback advice escaped its card."
          if old not in workflow:
              raise SystemExit('Workflow executive-summary anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "| Header CSS inheritance | A broad Test 3 `white-space: nowrap` rule was inherited by fixed dialogs mounted inside the header | Record shell mount ancestry, scope header selectors to direct controls, explicitly reset dialog inheritance and open every shared dialog in browser QA |"
          new = old + "\n| Internal modal overflow | IELTS 18 GT Test 1 showed that an outer modal can look correctly sized while its title/table/cards still overflow internally | Measure `scrollWidth` against `clientWidth` for dialog, scroll/body and representative cards/text; verify long advice wraps and headings remain inside the dialog |"
          if old not in workflow:
              raise SystemExit('Workflow delay-table anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "#### Never assume a fixed dialog is isolated from its mount ancestry\n\nThe shared shell may append fixed backdrops inside a header or toolbar mount. Inherited properties and containing-block rules can still affect the dialog. Record the mount ancestry, scope page-level selectors narrowly, and inspect the opened dialog rather than checking only its trigger."
          new = old + " The pass condition is rendered geometry, not appearance alone: the dialog and its internal scroll/body/card containers must not have unexplained horizontal overflow, and long learner-facing text must wrap inside its card."
          if old not in workflow:
              raise SystemExit('Workflow golden-rule anchor not found')
          workflow = workflow.replace(old, new, 1)

          start = workflow.find("### 16.8 Next target — Cambridge IELTS 18 GT Reading Test 1")
          end_marker = "\n---\n\n## 17. One-page runbook"
          end = workflow.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Workflow IELTS18 launch-gate block not found')
          replacement = '''### 16.8 Completed IELTS 18 GT Reading Test 1 — internal modal-overflow lesson

IELTS 18 GT Reading Test 1 is now the first Cambridge 18 continuation reference. Its final regression repair is PR #473, merged as `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`.

The defect was not that the modal itself exceeded the viewport. The target adapter applied `white-space: nowrap` to the whole right-hand header container, and the shared Reading shell mounts its dialogs inside that subtree. The inherited rule therefore reached Score guide and score-feedback descendants. The Score guide title/table could stretch sideways, and long `Focus next` advice could remain on one line and escape its card even though the outer dialog looked correctly positioned.

The fix established four permanent rules:

1. scope no-wrap/truncation to the exact header text/control that needs it; never use a broad header ancestor as a shortcut;
2. allow shared dialog descendants to shrink with `min-width: 0` where flex/grid containment requires it;
3. explicitly restore normal wrapping for dialog/backdrop content when target CSS inheritance can reach it;
4. verify internal rendered geometry, not just outer-modal visibility.

For Score guide, Answer Key and score feedback, the browser pass must now inspect the relevant dialog and internal scroll/body/card/text chain. Unexpected horizontal overflow fails when `scrollWidth > clientWidth + 1`. Long learner-facing advice must wrap to multiple lines when its natural length requires it. Dialog titles and table/card content must remain within the dialog bounding box.

Run this at a desktop viewport representative of the reported/target layout and again at approximately 390 px with extra-large text. A header or toolbar change cannot be declared complete until this internal-overflow matrix passes.

### 16.9 Next target — Cambridge IELTS 18 GT Reading Test 2

The next target is **Cambridge IELTS 18 General Training Reading Test 2**. Its HTML, source files, answer key, accepted variants and evaluator remain authoritative. Do not copy Test 1 task ranges, control shapes, accepted variants or adapter assumptions merely because both are Cambridge 18.

The initial read-only audit must explicitly verify:

- exact Section ranges, task groups and source-text roots;
- exact instructions, word limits, answers and accepted variants;
- current GT scoring, including the `Below 3` contract;
- Study → active Test → submitted Test information-control lifecycle using computed/visible state;
- blank/low-score submitted feedback and an authoritative submitted-result snapshot where practical;
- real matching/drag-drop interaction where present and final locking of every native/custom control;
- all 40 self-contained clue/Why/Skill trios;
- zero dead spacing from hidden feedback hosts;
- shell mount ancestry plus every header/toolbar selector that can inherit into nested dialogs;
- Score guide, Answer Key and score-feedback **internal** overflow using `scrollWidth <= clientWidth + 1`, not outer-dialog fit alone;
- long feedback wrapping and dialog-title/table/card containment at desktop and approximately 390 px with extra-large text;
- home route, leave warning, keyboard access and logo animation;
- current Live Hub route, Live Hub Safety Guard and Public dist guard constraints.

If an item already works, preserve it. Prefer a Test 2-local repair when a defect is local. A shared change still requires a focused generic failing test and the broader reference-set validation.
'''
          workflow = workflow[:start] + replacement + workflow[end:]

          old = "- run the Live Hub Safety Guard;\n- refresh protected reference fingerprints only after the relevant Reading validation passes and only for deliberately changed references;"
          new = "- run the Live Hub Safety Guard;\n- run the Public dist guard / least-privilege public build validation;\n- refresh protected reference fingerprints only after the relevant Reading validation passes and only for deliberately changed references;"
          if old not in workflow:
              raise SystemExit('Workflow one-page release anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "Record the Reading-shell mount ancestry. After any header, toolbar, mount or responsive CSS change, open and inspect the Score guide, Answer Key and score-feedback dialogs at desktop and narrow widths; button presence alone is not a pass."
          new = old + " The outer dialog fitting is also not enough: measure internal `scrollWidth`/`clientWidth`, confirm long feedback wraps, and keep dialog titles/tables/cards inside their bounding box, including a narrow extra-large-text case."
          if old not in workflow:
              raise SystemExit('Workflow Codex-preamble anchor not found')
          workflow = workflow.replace(old, new, 1)

          old = "## 19. Required exception format"
          addendum = '''## 19. Mandatory internal-overflow regression gate

Use this gate on every GT Reading target from IELTS 18 Test 2 onward, and on any existing test touched by header, toolbar, mount or responsive CSS work.

A pass requires all of the following:

- the shell mount ancestry is recorded before editing;
- no broad ancestor `white-space: nowrap`, `overflow`, `min-width`, flex/grid sizing or text-flow rule unintentionally controls nested Reading dialogs;
- Score guide, Answer Key and score feedback are actually opened in the browser;
- outer dialog positioning/visibility passes;
- dialog and internal scroll/body containers satisfy `scrollWidth <= clientWidth + 1` unless horizontal scrolling is an explicit product requirement;
- representative cards and long learner-facing text also satisfy the same width check;
- long `Focus next`/strategy/feedback sentences use normal wrapping and remain inside their card;
- title, introduction, table headings/content and close control remain inside the dialog bounding box;
- desktop plus approximately 390 px with extra-large text are tested;
- the permanent target regression would fail if the broad ancestor no-wrap/inheritance bug returned;
- Live Hub Safety Guard and Public dist guard pass before merge.

**Stop condition:** do not merge when the outer modal looks correct but any internal content clips, creates an unexplained horizontal scrollbar, remains forced onto one line, or exceeds its card/dialog geometry.

---

## 20. Required exception format'''
          if old not in workflow:
              raise SystemExit('Workflow exception heading not found')
          workflow = workflow.replace(old, addendum, 1)

          old = "**Cambridge 19 reference-set update:** lifecycle, interaction, scoring, layout, logo and self-contained feedback parity through 8 August 2026"
          new = "**Cambridge 19 + IELTS 18 Test 1 regression update:** lifecycle, interaction, scoring, layout, logo, self-contained feedback and internal modal-overflow parity through 8 August 2026"
          if old not in checklist:
              raise SystemExit('Checklist metadata anchor not found')
          checklist = checklist.replace(old, new, 1)

          old = "> **Dialog rule:** A Score guide, Answer Key or feedback button merely existing is not a pass. Open every available shared Reading dialog and verify its complete visible layout after any header, toolbar, mount or responsive CSS change."
          new = old + " The outer dialog fitting the viewport is not enough: verify internal dialog/scroll/body/card geometry, including `scrollWidth <= clientWidth + 1`, normal wrapping for long feedback, and title/table/card containment."
          if old not in checklist:
              raise SystemExit('Checklist dialog rule anchor not found')
          checklist = checklist.replace(old, new, 1)

          old = "- [ ] Live Hub Safety Guard passes."
          new = old + "\n- [ ] Public dist guard / least-privilege public build validation passes."
          if old not in checklist:
              raise SystemExit('Checklist release guard anchor not found')
          checklist = checklist.replace(old, new, 1)

          old = "## S. Cambridge 19 reference-set mandatory parity gate"
          new = "## S. Cambridge 19 reference-set + IELTS 18 Test 1 mandatory parity gate"
          if old not in checklist:
              raise SystemExit('Checklist S heading not found')
          checklist = checklist.replace(old, new, 1)

          insert_at = checklist.find("\n---\n\n## Required exception format")
          if insert_at < 0:
              raise SystemExit('Checklist exception separator not found')
          s7 = '''
### S7. IELTS 18 Test 1 internal modal-overflow regression

- [ ] Header no-wrap/truncation is scoped to the exact title/candidate/control that needs it; no whole header/right-header ancestor forces nested shell content to `white-space: nowrap`.
- [ ] Shell mount ancestry is recorded and target CSS inheritance into fixed backdrops is understood before changing header/toolbar layout.
- [ ] Score guide, Answer Key and score feedback are actually opened; outer-modal visibility alone is not a pass.
- [ ] Score guide dialog and its scroll container satisfy `scrollWidth <= clientWidth + 1` at desktop width.
- [ ] Score-feedback dialog, body, representative cards and long learner-facing text satisfy `scrollWidth <= clientWidth + 1`.
- [ ] Long `Focus next`/feedback advice has computed `white-space: normal` (or equivalent intended wrapping) and wraps to multiple lines when required by available width.
- [ ] Dialog titles, introductions, table headings/content, cards and close controls remain within the dialog bounding box.
- [ ] Flex/grid descendants that need to shrink have a valid shrink path (for example `min-width: 0`) rather than forcing horizontal expansion.
- [ ] The internal-overflow matrix is repeated at approximately 390 px with extra-large text.
- [ ] A target-specific permanent regression protects the discovered inheritance/overflow failure class when the target required a repair.
- [ ] A Playwright pointer-interception quirk is not confused with a layout defect: interaction is tested separately with real clicks where practical; layout geometry may be measured after a documented programmatic open only when the interaction itself is already proven.

### S8. Cambridge 18 continuation gate

- [ ] IELTS 18 GT Test 2 starts from current `main` and re-runs S1–S7 rather than assuming Test 1 implementation details transfer.
- [ ] The target’s own HTML, evaluator, accepted variants, source roots and control shapes remain authoritative.
- [ ] Any local defect is fixed locally unless a focused generic failing test proves a shared-shell blocker.
'''
          checklist = checklist[:insert_at] + "\n" + s7 + checklist[insert_at:]

          workflow_path.write_text(workflow, encoding='utf-8')
          checklist_path.write_text(checklist, encoding='utf-8')
          PY
          git diff --check
          git diff -- general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git commit -m "Update GT Reading workflow with IELTS 18 regression lessons"
          git push origin HEAD:docs/gt-reading-regression-lessons-2026-08-08
