name: Patch GT Reading regression documentation

on:
  push:
    paths:
      - '.gt-reading-regression-docs-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-regression-lessons-2026-08-08
          fetch-depth: 0
      - name: Update GT Reading workflow and parity checklist
        run: |
          python scripts/tmp_patch_gt_reading_docs.py
          python - <<'PY'
          from pathlib import Path
          path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Focused regression releases:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment; PR #473 — IELTS 18 GT Test 1 internal modal-overflow regression  \n', '**Focused regression releases:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment; PR #473 — IELTS 18 GT Test 1 internal modal-overflow regression\n', 1)
          text = text.replace('**Current reference commit:** `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`  \n', '**Current reference commit:** `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git commit -m "Update GT Reading workflow with IELTS 18 regression lessons"
          git push origin HEAD:docs/gt-reading-regression-lessons-2026-08-08
