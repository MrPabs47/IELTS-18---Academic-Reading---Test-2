name: Patch GT Reading regression documentation

on:
  push:
    paths:
      - '.gt-reading-regression-docs-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-regression-lessons-2026-08-08
          fetch-depth: 0
      - name: Update GT Reading workflow and parity checklist
        run: |
          python scripts/tmp_patch_gt_reading_docs.py
          git diff --check
          git diff -- general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git commit -m "Update GT Reading workflow with IELTS 18 regression lessons"
          git push origin HEAD:docs/gt-reading-regression-lessons-2026-08-08
