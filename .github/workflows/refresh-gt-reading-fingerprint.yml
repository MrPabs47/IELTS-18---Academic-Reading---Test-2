name: Refresh validated GT Reading fingerprint

on:
  push:
    branches:
      - fix/gt-reading-info-control-lifecycle
    paths:
      - .gt-reading-fingerprint-refresh/READY

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt-reading-info-control-lifecycle
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh approved reference fingerprints
        run: python scripts/verify_live_hub.py --refresh-fingerprints

      - name: Commit validated fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/live-hub-contract.json
          if git diff --cached --quiet; then
            echo "No fingerprint changes were required."
            exit 0
          fi
          git commit -m "Approve validated GT Reading shell fingerprint"
          git push origin HEAD:fix/gt-reading-info-control-lifecycle
