name: Restore IELTS 19 GT clue controls

on:
  push:
    branches:
      - agent/restore-gt19-clue-controls
    paths:
      - .github/workflows/restore-gt19-clue-controls.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-gt19-clue-controls
          fetch-depth: 0

      - name: Enable complete Study Mode clue coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('general-training/cambridge-19/test-1/study-feedback.js'),
              Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
          ]

          pattern = re.compile(r'(study:\s*\{\s*\n)(\s*)(taskGroups:)')

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'completeClueCoverage: true' in text and 'completeQuestionCoverage: true' in text:
                  continue
              updated, count = pattern.subn(
                  lambda match: (
                      match.group(1)
                      + match.group(2) + 'completeQuestionCoverage: true,\n'
                      + match.group(2) + 'completeClueCoverage: true,\n'
                      + match.group(2) + match.group(3)
                  ),
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not patch the Study Mode config in {path}')
              path.write_text(updated, encoding='utf-8')

          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert text.count('completeQuestionCoverage: true') == 1, path
              assert text.count('completeClueCoverage: true') == 1, path
          PY

      - name: Run static checks
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-1/study-feedback.js
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path('general-training/cambridge-19/test-1/study-feedback.js'),
              Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
          ]:
              text = path.read_text(encoding='utf-8')
              assert 'completeQuestionCoverage: true' in text
              assert 'completeClueCoverage: true' in text
              assert 'allowDomSubmittedResult: true' in text
          print('Static clue-capability checks passed for both IELTS 19 GT tests.')
          PY

      - name: Run browser regression checks
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --prefix /tmp/gt19-clue-test --no-save puppeteer-core@24.16.0 >/dev/null
          cat > /tmp/gt19-clue-test/check.js <<'JS'
          const puppeteer = require('/tmp/gt19-clue-test/node_modules/puppeteer-core');

          const pages = [
            'general-training/cambridge-19/test-1/IELTS19%20Test%201%20-%20Reading%20-%20GT.html',
            'general-training/cambridge-19/test-2/IELTS19%20Test%202%20-%20Reading%20-%20GT.html'
          ];

          async function run(path) {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            try {
              const page = await browser.newPage();
              const consoleErrors = [];
              page.on('pageerror', error => consoleErrors.push(String(error)));
              await page.goto('http://127.0.0.1:8765/' + path, { waitUntil: 'networkidle0' });

              await page.waitForFunction(() => Array.from(document.querySelectorAll('button')).some(button => /study/i.test(button.textContent || '')));
              await page.evaluate(() => {
                const button = Array.from(document.querySelectorAll('button')).find(node => /study/i.test(node.textContent || ''));
                if (!button) throw new Error('Study Mode button not found');
                button.click();
              });
              await page.waitForFunction(() => document.getElementById('app') && getComputedStyle(document.getElementById('app')).display !== 'none');
              await page.waitForFunction(() => window.ReadingFeatureShell && typeof window.ReadingFeatureShell.sync === 'function');

              await page.evaluate(() => {
                if (typeof window.submitTest !== 'function') throw new Error('submitTest is unavailable');
                window.submitTest();
              });

              await page.waitForFunction(() => document.querySelectorAll('.reading-shell-study-clue-button').length === 40);
              const state = await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('.reading-shell-study-clue-button'));
                const visible = buttons.filter(button => !button.hidden && !button.disabled);
                const sectionToggle = document.getElementById('passageClueToggle');
                return {
                  total: buttons.length,
                  visible: visible.length,
                  sectionToggleReady: Boolean(sectionToggle && !sectionToggle.hidden && !sectionToggle.disabled)
                };
              });

              if (state.total !== 40 || state.visible !== 40 || !state.sectionToggleReady) {
                throw new Error('Incomplete clue controls for ' + path + ': ' + JSON.stringify(state));
              }

              await page.evaluate(() => document.querySelector('.reading-shell-study-clue-button').click());
              await page.waitForFunction(() => document.querySelector('.reading-shell-evidence-highlight'));

              if (consoleErrors.length) throw new Error('Browser errors for ' + path + ': ' + consoleErrors.join(' | '));
              console.log('Full clue controls passed:', path);
            } finally {
              await browser.close();
            }
          }

          (async () => {
            for (const path of pages) await run(path);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-clue-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-clue-test/check.js

      - name: Commit only the tested fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/restore-gt19-clue-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            general-training/cambridge-19/test-1/study-feedback.js \
            "general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html" \
            .github/workflows/restore-gt19-clue-controls.yml
          git commit -m "Restore IELTS 19 GT clue controls"
          git push origin HEAD:agent/restore-gt19-clue-controls
