name: Finalise GT Reading lessons docs

on:
  push:
    branches:
      - docs/gt-reading-cambridge19-lessons
    paths:
      - .gt-reading-docs-patch/FINAL

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-cambridge19-lessons
      - name: Finalise workflow and checklist consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          wf_path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          ck_path = Path('general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md')
          wf = wf_path.read_text(encoding='utf-8')
          ck = ck_path.read_text(encoding='utf-8')

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          wf = one(wf,
              '**Current reference commit:** `94455b5135879d06e514388a2ba9341bb3273144`',
              '**Current reference commit:** `a52f6f9e67059e5c337167bc9091efb6fce8adda`',
              'reference commit')
          wf = one(wf,
              'Both reference tests use the project’s shared Reading assets:',
              'All four reference tests use the project’s shared Reading assets:',
              'shared asset wording')
          wf = one(wf,
              '- apply the Aha test to every clue/Why/Skill trio;\n- ensure each clue is the shortest complete evidence span, not simply the shortest possible span;',
              '- apply the self-contained Aha test to every clue/Why/Skill trio: question + clue(s) + Why must explain the answer without surrounding passage context;\n- prefer one complete clue sentence, or two short connected sentences where the logic genuinely crosses a sentence boundary;\n- ensure each clue is the shortest complete evidence span, not simply the shortest possible span;',
              'runbook student-data wording')
          wf = one(wf,
              '- confirm Test locking including custom controls;\n- check desktop/mobile/themes/text size/home route/console;',
              '- confirm Study information/ⓘ controls are visible in Study, absent during the active Test and restored after Test submission;\n- submit a blank/low-score Test and confirm `Below 3` reaches submitted Score feedback;\n- exercise real matching/drag-drop interaction where present, then confirm final locking including custom controls;\n- check hidden feedback hosts for zero dead spacing before reveal;\n- check desktop/mobile/themes/text size/home route/logo animation/console;',
              'runbook precommit parity')
          wf = one(wf,
              '- verify checks and mergeability;\n- squash merge;',
              '- verify checks and mergeability;\n- run the Live Hub Safety Guard;\n- refresh protected reference fingerprints only after the relevant Reading validation passes and only for deliberately changed references;\n- keep unrelated Hub repair/activation work in separate PRs;\n- squash merge;',
              'runbook release safety')

          ck = one(ck,
              '- [ ] Target is compared against GT19 Test 2 direct integration and GT19 Test 1 legacy integration.',
              '- [ ] Target is compared against the validated Cambridge 19 GT Tests 1–4 behavioural reference set; Test 2 is the direct-integration reference and Test 1 the legacy-adapter reference.',
              'checklist audit reference set')
          ck = one(ck,
              '- [ ] Every exact task group has strategy information.',
              '- [ ] Every exact task group has visible strategy information/ⓘ controls in Study Mode.',
              'checklist study controls')
          ck = one(ck,
              '- [ ] Strategies and feedback cards are hidden.',
              '- [ ] Strategies, feedback cards and all Study information/ⓘ controls are hidden; zero such controls are visually present during the active Test.',
              'checklist active test controls')
          ck = one(ck,
              '- [ ] Answer Key, score guide, feedback and clues become available.',
              '- [ ] Study information/ⓘ controls, Answer Key, score guide, feedback and clues become available again.',
              'checklist submitted controls')
          ck = one(ck,
              '- [ ] Feedback derives from the submitted result, not mutable live answers.',
              '- [ ] Feedback derives from the submitted result, not mutable live answers.\n- [ ] A blank/low-score submission initialises completed-Test feedback and displays `Submitted band: Below 3.` under the current contract.',
              'checklist submitted below3')
          ck = one(ck,
              '- [ ] GT band conversion is used, not Academic conversion.',
              '- [ ] GT band conversion is used, not Academic conversion.\n- [ ] Under the current project contract, 0–8 returns/displays `Below 3` and 9–11 returns/displays Band 3.\n- [ ] `Below 3` round-trips through evaluator, result overlay, submitted-result snapshot/parser, Score guide and submitted Score feedback.',
              'checklist scoring contract')
          ck = one(ck,
              '- [ ] Active Test leave warning appears before home navigation.',
              '- [ ] Active Test leave warning appears before home navigation.\n- [ ] Established per-letter logo hover animation works without breaking the home route and honours reduced-motion preferences.',
              'checklist logo parity')
          ck = one(ck,
              '- [ ] Inline completions wrap naturally.',
              '- [ ] Inline completions wrap naturally.\n- [ ] Hidden/unrevealed feedback hosts contribute zero unexplained vertical gap; revealing feedback expands normally and hiding it contracts normally.',
              'checklist dead-space parity')
          ck = one(ck,
              '- [ ] Browser lifecycle test covers Fresh/checked Study and Fresh/completed Test.',
              '- [ ] Browser lifecycle test covers Fresh/checked Study and Fresh/completed Test, explicitly asserting Study-info visible → active-Test hidden → submitted-Test visible.\n- [ ] A blank/low-score completed-Test case verifies `Below 3` feedback initialises successfully.',
              'checklist lifecycle test')
          ck = one(ck,
              '- [ ] Custom-control locking is executable where present.',
              '- [ ] Where present, matching/drag-drop QA exercises real drag, click-to-place, keyboard placement, repeated-letter reuse and Clear/reset before verifying submitted locking.',
              'checklist real interaction')
          ck = one(ck,
              '- [ ] Highlighted clue spans are neither misleadingly short nor unnecessarily broad.',
              '- [ ] Highlighted clue spans are neither misleadingly short nor unnecessarily broad, and representative clues pass the self-contained question + clue(s) + Why test.',
              'checklist visual clue quality')
          ck = one(ck,
              '- [ ] Custom matching/drag/drop locking checked.',
              '- [ ] Where present, matching/drag-drop is actually used via its supported drag/click/keyboard/reuse/Clear paths before submitted locking is checked.\n- [ ] Active Test shows zero visible Study information/ⓘ controls; completed Test restores them.\n- [ ] Blank/low-score submission shows `Below 3` in results and submitted Score feedback.\n- [ ] Hidden feedback hosts show no dead vertical space before reveal.',
              'checklist visual lifecycle interaction')
          ck = one(ck,
              '- [ ] Home route checked.',
              '- [ ] Home route, leave warning, keyboard activation and logo hover animation checked.',
              'checklist visual logo')
          ck = one(ck,
              '- [ ] PR changed-file list is correct.\n- [ ] Validation and environment limitations are documented.',
              '- [ ] PR changed-file list is correct.\n- [ ] Live Hub Safety Guard passes.\n- [ ] Protected reference fingerprints are refreshed only after the relevant Reading validation passes and only for deliberately changed reference files.\n- [ ] Unrelated Live Hub contract repair, activation or seasonal work is kept in a separate PR.\n- [ ] Validation and environment limitations are documented.',
              'checklist release safety')

          wf_path.write_text(wf, encoding='utf-8')
          ck_path.write_text(ck, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md general-training/shared/GT_READING_TEST_PARITY_CHECKLIST.md
          git commit -m "Finalise GT Reading Cambridge 19 lessons"
          git push origin HEAD:docs/gt-reading-cambridge19-lessons
