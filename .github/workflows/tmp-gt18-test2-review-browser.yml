name: Temporary IELTS 18 GT Test 2 review browser QA

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  browser:
    if: github.head_ref == 'fix/ielts18-gt-test2-source-clues-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run focused browser QA
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/gt18t2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const url = 'http://127.0.0.1:8000/general-training/cambridge-18/test-2/IELTS18%20Test%202%20-%20Reading%20-%20GT.html';

          function sortedNumbers(values) {
            return [...new Set(values.map(Number))].sort((a,b) => a-b);
          }
          async function startStudy(page) {
            await page.goto(url, { waitUntil: 'domcontentloaded' });
            await page.locator('[data-mode="study"]').click();
            await page.locator('#app').waitFor({ state: 'visible' });
            await page.waitForFunction(() => document.querySelectorAll('.reading-shell-study-icon-button').length === 7);
          }
          async function startTest(page, name='Pablo Jaramillo') {
            await page.goto(url, { waitUntil: 'domcontentloaded' });
            await page.locator('[data-mode="test"]').click();
            await page.locator('#studentNameInput').fill(name);
            await page.locator('#testStartScreen .mode-btn').click();
            await page.locator('#app').waitFor({ state: 'visible' });
            await page.waitForFunction(() => document.querySelector('#primarySubmitBtn'));
          }
          async function submitFinal(page) {
            page.once('dialog', async dialog => { await dialog.accept(); });
            await page.locator('#primarySubmitBtn').click();
            await page.waitForFunction(() => {
              const overlay = document.getElementById('resultsOverlay');
              return overlay && getComputedStyle(overlay).display !== 'none';
            });
            const close = page.locator('#resultsCloseBtn');
            if (await close.count()) await close.click();
            await page.waitForFunction(() => {
              const button = document.querySelector('.reading-shell-score-feedback-button');
              return button && !button.hidden;
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push('pageerror: ' + error.message));
            page.on('console', msg => {
              if (msg.type() === 'error' && !/favicon/i.test(msg.text())) errors.push('console: ' + msg.text());
            });

            await startStudy(page);

            const bodyText = await page.locator('body').innerText();
            for (const expected of [
              'no-frills, budget sleeping bag',
              'animal-themed coat',
              'Life Writing is defined as non-fiction',
              'The regulation chefs’ shirts',
              'each time they cut different types of food',
              'staff must not try to fix them themselves',
              'A home-sewing revival: the return of Clothkits',
              'Sew-your-own kits',
              'experiment with colour',
              'In her late twenties',
              'mass-producing manufacturer'
            ]) assert(bodyText.includes(expected), 'missing corrected official text: ' + expected);
            assert(bodyText.includes('Writers only submit one entry each.'), 'official Life Writing sentence must remain unchanged');

            const toggle = page.locator('#passageClueToggle');
            await toggle.waitFor({ state: 'visible' });
            await toggle.click();
            await page.waitForFunction(() => document.querySelectorAll('#text-s1-section .reading-shell-clue-badge').length >= 14);
            let questions = await page.locator('#text-s1-section .reading-shell-clue-badge').evaluateAll(nodes => nodes.map(n => n.dataset.readingShellClueQuestion));
            assert.deepStrictEqual(sortedNumbers(questions), Array.from({length:14}, (_,i)=>i+1), 'Section 1 clue map must cover Q1–14 across both texts');

            await page.evaluate(() => switchSection(2));
            await page.waitForFunction(() => Number(activeSection) === 2);
            await page.locator('#passageClueToggle').click();
            await page.waitForFunction(() => document.querySelectorAll('#text-s2-section .reading-shell-clue-badge').length >= 13);
            questions = await page.locator('#text-s2-section .reading-shell-clue-badge').evaluateAll(nodes => nodes.map(n => n.dataset.readingShellClueQuestion));
            assert.deepStrictEqual(sortedNumbers(questions), Array.from({length:13}, (_,i)=>i+15), 'Section 2 clue map must cover Q15–27 across both texts');

            const q25Clue = page.locator('.question-block[data-q="25"] .reading-shell-study-clue-button');
            await q25Clue.click();
            await page.waitForFunction(() => document.querySelector('#text-s2-section .reading-shell-evidence-focus'));
            assert((await page.locator('#text-s2-section').innerText()).includes('must not try to fix them themselves'), 'Q25 clue must resolve against corrected source text');

            await page.close();
            const testPage = await context.newPage();
            testPage.on('pageerror', error => errors.push('test pageerror: ' + error.message));
            testPage.on('console', msg => {
              if (msg.type() === 'error' && !/favicon/i.test(msg.text())) errors.push('test console: ' + msg.text());
            });
            await startTest(testPage);
            assert.strictEqual(await testPage.locator('.reading-shell-study-icon-button:visible').count(), 0, 'active Test must hide strategy controls');
            await submitFinal(testPage);

            const desktopPlacement = await testPage.locator('.reading-shell-score-feedback-button').evaluate(button => ({
              parentIsTopLeft: button.parentElement && button.parentElement.classList.contains('top-left'),
              previousId: button.previousElementSibling && button.previousElementSibling.id,
              candidate: document.getElementById('candidateNameDisplay')?.textContent || ''
            }));
            assert(desktopPlacement.parentIsTopLeft, 'desktop score feedback must live in top-left candidate row');
            assert.strictEqual(desktopPlacement.previousId, 'candidateNameDisplay', 'score feedback must be immediately after Candidate');
            assert.strictEqual(desktopPlacement.candidate, 'Candidate: Pablo Jaramillo');

            await testPage.evaluate(() => switchSection(3));
            await testPage.waitForFunction(() => Number(activeSection) === 3);
            const summaryInfo = testPage.locator('#study-instruction-s3-summary .reading-shell-study-icon-button');
            await summaryInfo.waitFor({ state: 'visible' });
            await summaryInfo.click();
            const summaryPlacement = await testPage.locator('.summary-completion-box').evaluate(box => {
              const panel = box.previousElementSibling;
              return {
                previousClass: panel && panel.className,
                panelHidden: panel ? panel.hidden : null,
                panelInsideParagraph: Boolean(panel && panel.closest('.summary-completion-box p')),
                boxHasSummaryClass: box.classList.contains('summary-box')
              };
            });
            assert(summaryPlacement.boxHasSummaryClass, 'summary completion box must be a strategy anchor');
            assert(summaryPlacement.previousClass && summaryPlacement.previousClass.includes('reading-shell-study-panel'), 'strategy panel must sit immediately above the whole summary box');
            assert.strictEqual(summaryPlacement.panelHidden, false, 'summary strategy panel must open');
            assert.strictEqual(summaryPlacement.panelInsideParagraph, false, 'summary strategy panel must never sit inside the first summary line');

            await testPage.setViewportSize({ width: 390, height: 844 });
            await testPage.waitForTimeout(150);
            const mobilePlacement = await testPage.locator('.reading-shell-score-feedback-button').evaluate(button => {
              const rect = button.getBoundingClientRect();
              return {
                inResourceRoot: Boolean(button.parentElement && button.parentElement.classList.contains('reading-shell-root')),
                left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom,
                hidden: button.hidden
              };
            });
            assert(mobilePlacement.inResourceRoot, 'mobile score feedback must move to Reading resource row');
            assert(!mobilePlacement.hidden && mobilePlacement.left >= -1 && mobilePlacement.right <= 391 && mobilePlacement.top >= -1 && mobilePlacement.bottom <= 845, 'mobile score feedback must remain reachable');

            await testPage.locator('.reading-shell-score-feedback-button').click();
            await testPage.locator('.reading-shell-score-feedback-dialog').waitFor({ state: 'visible' });
            const geometry = await testPage.locator('.reading-shell-score-feedback-dialog').evaluate(dialog => ({
              scrollWidth: dialog.scrollWidth,
              clientWidth: dialog.clientWidth,
              bodyScroll: dialog.querySelector('.reading-shell-score-feedback-body')?.scrollWidth || 0,
              bodyClient: dialog.querySelector('.reading-shell-score-feedback-body')?.clientWidth || 0
            }));
            assert(geometry.scrollWidth <= geometry.clientWidth + 1, 'score feedback dialog must not overflow horizontally');
            assert(geometry.bodyScroll <= geometry.bodyClient + 1, 'score feedback body must not overflow horizontally');

            assert.deepStrictEqual(errors, [], 'browser console/page errors: ' + errors.join(' | '));
            await browser.close();
            console.log('IELTS 18 GT Test 2 user-reported review browser QA passed.');
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          JS
