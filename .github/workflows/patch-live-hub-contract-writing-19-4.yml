name: Patch Live Hub Academic Writing 19-4 contract

on:
  push:
    paths:
      - '.live-hub-19-4-contract-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-hub-contract-academic-writing-19-4
          fetch-depth: 0
      - name: Align contract with published Academic Writing Test 4
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          index_path = Path('index.html')
          contract_path = Path('hub/live-hub-contract.json')
          index = index_path.read_text(encoding='utf-8')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))

          matches = re.findall(r"const availability=\{[^\n]+?\};", index)
          if len(matches) != 1:
              raise SystemExit(f'Expected one Live Hub availability fragment, found {len(matches)}')
          availability = matches[0]
          if "academicWriting:new Set(['19-1','19-2','19-3','19-4'" not in availability:
              raise SystemExit('Live Hub does not currently advertise Academic Writing 19-4')

          excluded = contract['categories']['academicWriting']['excluded']
          if '19-4' not in excluded:
              raise SystemExit('Contract does not currently exclude Academic Writing 19-4')

          contract['version'] = int(contract.get('version', 0)) + 1
          contract['index_availability_fragment'] = availability
          contract['categories']['academicWriting']['excluded'] = [item for item in excluded if item != '19-4']
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          python scripts/verify_live_hub.py --base-sha "$(git merge-base HEAD origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/live-hub-contract.json
          git commit -m "Align Live Hub contract with Academic Writing Test 4"
          git push origin HEAD:fix/live-hub-contract-academic-writing-19-4
