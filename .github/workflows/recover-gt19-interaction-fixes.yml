name: Recover GT19 interaction fixes
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/recover-gt19-interaction-fixes.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gt19-interactions-and-shortcuts
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          line = "  document.write('<script src=\"../../shared/gt-reading-exam-guards.js\"><\\/script>');\n"
          anchor = '  "use strict";\n'
          for n in (1,2,3):
              p = Path(f'general-training/cambridge-19/test-{n}/study-feedback.js')
              t = p.read_text(encoding='utf-8')
              if line not in t:
                  if anchor not in t: raise SystemExit(f'anchor missing: {p}')
                  t = t.replace(anchor, anchor + '\n' + line, 1)
                  p.write_text(t, encoding='utf-8')
          html = Path('general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html').read_text(encoding='utf-8')
          assert 'Drag answers for questions 1 to 8' in html
          assert 'Drag answers for questions 9 to 14' in html
          for q in range(1,15):
              assert f'name="q{q}"' in html and f'data-for="q{q}"' in html
          PY
          node --check general-training/shared/gt-reading-exam-guards.js
          for f in general-training/cambridge-19/test-{1,2,3}/study-feedback.js; do node --check "$f"; grep -q '../../shared/gt-reading-exam-guards.js' "$f"; done
      - name: Commit clean result
        shell: bash
        run: |
          rm -f .github/workflows/apply-gt19-interaction-fixes.yml .github/workflows/recover-gt19-interaction-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add general-training/shared/gt-reading-exam-guards.js general-training/cambridge-19/test-{1,2,3}/study-feedback.js .github/workflows
          git commit -m 'Fix GT19 Reading interactions and test shortcuts'
          git push origin HEAD:agent/fix-gt19-interactions-and-shortcuts
