name: Build IELTS 19 GT Test 3 Study Mode

on:
  push:
    branches:
      - agent/add-gt19-test3-study-mode
    paths:
      - .github/workflows/build-gt19-test3-study.yml

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt19-test3-study-mode
          fetch-depth: 0

      - name: Write Test 3 Study Mode data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = ''''''
          target = Path('general-training/cambridge-19/test-3/study-feedback-data.js')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Generate Test 3 Study Mode adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('general-training/cambridge-19/test-1/study-feedback.js').read_text(encoding='utf-8')
          source = source.replace('IELTS19GTTest1StudyFeedback', 'IELTS19GTTest3StudyFeedback')
          source = source.replace('cambridge-19-general-training-reading-test-1', 'cambridge-19-general-training-reading-test-3')
          source = source.replace('IELTS 19 General Training Reading Test 1', 'IELTS 19 General Training Reading Test 3')
          source = source.replace('__gtTest1Localised', '__gtTest3Localised')
          source = source.replace('IELTS 19 GT Test 1 Study Mode assets could not load.', 'IELTS 19 GT Test 3 Study Mode assets could not load.')
          source = source.replace('IELTS 19 GT Test 1 Study Mode could not initialise.', 'IELTS 19 GT Test 3 Study Mode could not initialise.')

          instruction_function = '''  function prepareInstructionHosts() {
    var s1 = document.querySelector('#questionContent > div[data-section="1"]');
    var s2 = document.querySelector('#questionContent > div[data-section="2"]');
    var s3 = document.querySelector('#questionContent > div[data-section="3"]');

    if (s1) {
      wrapRange(s1, directChildByText(s1, "p", "SECTION 1 Questions"), s1.querySelector('.question-block[data-q="1"]'), "study-instruction-s1-films");
      wrapRange(s1, directChildByText(s1, "p.question-group-heading", "Sports events in New Zealand"), s1.querySelector('.question-block[data-q="9"]'), "study-instruction-s1-sports");
    }
    if (s2) {
      wrapRange(s2, directChildByText(s2, "p", "SECTION 2 Questions"), s2.querySelector('.question-block[data-q="15"]'), "study-instruction-s2-redundancy");
      wrapRange(s2, directChildByText(s2, "p.question-group-heading", "Palvin"), s2.querySelector('.question-block[data-q="22"]'), "study-instruction-s2-restaurant");
    }
    if (s3) {
      wrapRange(s3, directChildByText(s3, "p", "SECTION 3 Questions"), s3.querySelector('.question-block[data-q="28"]'), "study-instruction-s3-mc");
      wrapRange(s3, directChildByText(s3, "p", "Questions 33 to 36"), s3.querySelector('.question-block[data-q="33"]'), "study-instruction-s3-paragraphs");
      wrapRange(s3, directChildByText(s3, "p", "Questions 37 to 40"), s3.querySelector('.summary-box'), "study-instruction-s3-summary");
    }
  }
'''
          source, count = re.subn(r'  function prepareInstructionHosts\(\) \{.*?\n  \}\n\n(?=  function prepareTextRoots)', instruction_function + '\n', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace prepareInstructionHosts')

          roots_function = '''  function prepareTextRoots() {
    var s1 = document.querySelector('.passage-section[data-section="1"]');
    var s2 = document.querySelector('.passage-section[data-section="2"]');
    var s3 = document.querySelector('.passage-section[data-section="3"]');

    function wrapBeforeDivider(section, id) {
      if (!section || document.getElementById(id)) return;
      var divider = section.querySelector(":scope > .passage-divider");
      if (!divider) return;
      var wrapper = document.createElement("div");
      wrapper.className = "reading-text";
      wrapper.id = id;
      section.insertBefore(wrapper, section.firstChild);
      while (wrapper.nextSibling && wrapper.nextSibling !== divider) wrapper.appendChild(wrapper.nextSibling);
    }

    wrapBeforeDivider(s1, "text-s1-films");
    if (s1) {
      var sports = s1.querySelector(":scope > .passage-divider");
      if (sports) { sports.id = "text-s1-sports"; sports.classList.add("reading-text"); }
    }
    wrapBeforeDivider(s2, "text-s2-redundancy");
    if (s2) {
      var restaurant = s2.querySelector(":scope > .passage-divider");
      if (restaurant) { restaurant.id = "text-s2-restaurant"; restaurant.classList.add("reading-text"); }
    }
    if (s3) { s3.id = "text-s3-women"; s3.classList.add("reading-text"); }
  }
'''
          source, count = re.subn(r'  function prepareTextRoots\(\) \{.*?\n  \}\n\n(?=  function prepareInlineFeedbackHosts)', roots_function + '\n', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace prepareTextRoots')

          source = source.replace('for (var question = 33; question <= 37; question += 1)', 'for (var question = 37; question <= 40; question += 1)', 1)

          guard = '''  function installSubmittedInteractionGuard() {
    ["click", "keydown", "dragstart", "drop"].forEach(function (type) {
      document.addEventListener(type, function (event) {
        if (mode !== "test" || !testSubmitted) return;
        var target = event.target && event.target.closest ? event.target.closest(".drag-item,.drop-zone,.clear-drop-btn") : null;
        if (!target) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
    });
  }

'''
          source = source.replace('  function initStudyMode() {', guard + '  function initStudyMode() {', 1)
          source = source.replace('    prepareInlineFeedbackHosts();\n    patchPageFunctions();', '    prepareInlineFeedbackHosts();\n    installSubmittedInteractionGuard();\n    patchPageFunctions();', 1)

          Path('general-training/cambridge-19/test-3/study-feedback.js').write_text(source, encoding='utf-8')
          PY

      - name: Connect Study Mode loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html')
          text = path.read_text(encoding='utf-8')
          loader = '  <script src="study-feedback.js"></script>\n'
          if loader not in text:
              needle = '  <script>\n    /***************'
              if needle not in text:
                  raise SystemExit('Could not locate the main inline script')
              text = text.replace(needle, loader + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run static checks
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-3/study-feedback-data.js
          node --check general-training/cambridge-19/test-3/study-feedback.js
          node - <<'JS'
          global.window = {};
          require('./general-training/cambridge-19/test-3/study-feedback-data.js');
          const data = window.IELTS19GTTest3StudyFeedback;
          if (!data || Object.keys(data.questions).length !== 40) throw new Error('Expected 40 feedback records');
          const represented = data.taskGroups.flatMap(group => group.questions);
          if (represented.length !== 40 || new Set(represented).size !== 40) throw new Error('Task groups must cover Questions 1–40 exactly once');
          for (let q = 1; q <= 40; q += 1) {
            const record = data.questions[q];
            if (!record || !record.answer || !record.explanation || !record.skill || !record.evidence || !record.evidenceRoot) throw new Error('Incomplete Question ' + q);
          }
          console.log('Static Test 3 Study Mode contract passed.');
          JS
          grep -q 'script src="study-feedback.js"' "general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html"
          grep -q 'completeClueCoverage: true' general-training/cambridge-19/test-3/study-feedback.js

      - name: Run browser lifecycle checks
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --prefix /tmp/gt19-test3-browser --no-save puppeteer-core@24.16.0 >/dev/null
          cat > /tmp/gt19-test3-browser/check.js <<'JS'
          const puppeteer = require('/tmp/gt19-test3-browser/node_modules/puppeteer-core');
          const url = 'http://127.0.0.1:8765/general-training/cambridge-19/test-3/IELTS19%20Test%203%20-%20Reading%20-%20GT.html';

          async function newBrowser() {
            return puppeteer.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });
          }

          async function studyLifecycle() {
            const browser = await newBrowser();
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto(url, { waitUntil: 'networkidle0' });
              await page.waitForFunction(() => Array.from(document.querySelectorAll('button')).some(button => /study mode/i.test(button.textContent || '')));
              await page.evaluate(() => Array.from(document.querySelectorAll('button')).find(button => /study mode/i.test(button.textContent || '')).click());
              await page.waitForFunction(() => document.getElementById('app') && getComputedStyle(document.getElementById('app')).display !== 'none');
              await page.waitForFunction(() => window.ReadingFeatureShell && window.readingFeatureShellConfig);

              await page.evaluate(() => {
                const q1 = document.querySelector('select[name="q1"]');
                q1.value = 'E';
                q1.dispatchEvent(new Event('change', { bubbles: true }));
                const q15 = document.querySelector('input[name="q15"]');
                q15.value = 'list';
                q15.dispatchEvent(new Event('input', { bubbles: true }));
                window.submitTest();
              });

              await page.waitForFunction(() => document.querySelectorAll('.reading-shell-study-clue-button').length === 40);
              const state = await page.evaluate(() => {
                const clues = Array.from(document.querySelectorAll('.reading-shell-study-clue-button'));
                const toggle = document.getElementById('passageClueToggle');
                return {
                  visibleClues: clues.filter(button => !button.hidden && !button.disabled).length,
                  toggleReady: Boolean(toggle && !toggle.hidden && !toggle.disabled),
                  feedbackCards: document.querySelectorAll('.reading-shell-study-feedback-card').length,
                  scoreText: (document.getElementById('readingShellScorePill') || {}).textContent || ''
                };
              });
              if (state.visibleClues !== 40 || !state.toggleReady || state.feedbackCards !== 40) throw new Error('Incomplete Study Mode: ' + JSON.stringify(state));
              await page.evaluate(() => document.querySelector('.reading-shell-study-clue-button').click());
              await page.waitForFunction(() => document.querySelector('.reading-shell-evidence-highlight'));
              if (errors.length) throw new Error(errors.join(' | '));
              console.log('Study Mode lifecycle passed:', JSON.stringify(state));
            } finally {
              await browser.close();
            }
          }

          async function testLifecycle() {
            const browser = await newBrowser();
            try {
              const page = await browser.newPage();
              await page.goto(url, { waitUntil: 'networkidle0' });
              await page.evaluate(() => window.startTest('test'));
              await page.evaluate(() => {
                const q1 = document.querySelector('select[name="q1"]');
                q1.value = 'E';
                q1.dispatchEvent(new Event('change', { bubbles: true }));
                window.submitTest();
              });
              await page.waitForFunction(() => window.testSubmitted === true || document.querySelector('select[name="q1"]').disabled);
              const locked = await page.evaluate(() => ({
                inputDisabled: document.querySelector('select[name="q1"]').disabled,
                submitDisabled: Boolean(document.getElementById('primarySubmitBtn') && document.getElementById('primarySubmitBtn').disabled),
                dragLocked: document.querySelector('.drop-zone').getAttribute('aria-disabled') === 'true'
              }));
              if (!locked.inputDisabled || !locked.submitDisabled || !locked.dragLocked) throw new Error('Test Mode did not lock: ' + JSON.stringify(locked));
              console.log('Test Mode lifecycle passed:', JSON.stringify(locked));
            } finally {
              await browser.close();
            }
          }

          (async () => {
            await studyLifecycle();
            await testLifecycle();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-test3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-test3-browser/check.js

      - name: Commit tested Test 3 files
        shell: bash
        run: |
          rm -f .github/workflows/build-gt19-test3-study.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html" \
            general-training/cambridge-19/test-3/study-feedback.js \
            general-training/cambridge-19/test-3/study-feedback-data.js \
            .github/workflows/build-gt19-test3-study.yml
          git commit -m "Add IELTS 19 GT Test 3 Study mode"
          git push origin HEAD:agent/add-gt19-test3-study-mode
