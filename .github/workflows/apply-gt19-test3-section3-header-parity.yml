name: Apply GT19 Test 3 Section 3 and header parity

on:
  push:
    branches:
      - agent/gt19-test3-section3-header-parity
    paths:
      - .github/scripts/gt19-test3-section3-header-parity.sh

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gt19-test3-section3-header-parity
          fetch-depth: 0

      - name: Apply patch and run browser regression
        shell: bash
        run: bash .github/scripts/gt19-test3-section3-header-parity.sh

      - name: Commit validated website change and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-gt19-test3-section3-header-parity.yml
          rm .github/scripts/gt19-test3-section3-header-parity.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add general-training/shared/gt-reading-test-runtime.js \
            .github/workflows/apply-gt19-test3-section3-header-parity.yml \
            .github/scripts/gt19-test3-section3-header-parity.sh
          git commit -m 'Match Test 3 Section 3 and header patterns'
          git push origin HEAD:agent/gt19-test3-section3-header-parity
