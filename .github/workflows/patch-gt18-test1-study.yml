name: Patch IELTS 18 GT Test 1 Study integration

on:
  push:
    paths:
      - '.gt18-test1-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ielts18-gt-test1-study-feedback
      - name: Wire target adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('general-training/cambridge-18/test-1/IELTS18 Test 1 - Reading - GT.html')
          text = path.read_text(encoding='utf-8')
          script = '  <script src="study-feedback.js"></script>\n'
          if script not in text:
              marker = '</body>\n\n</html>'
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected one closing body marker, found {text.count(marker)}')
              text = text.replace(marker, script + marker, 1)
          if text.count('study-feedback.js') != 1:
              raise SystemExit('Study adapter script integration is not unique')
          path.write_text(text, encoding='utf-8')
          PY
          git diff -- general-training/cambridge-18/test-1/'IELTS18 Test 1 - Reading - GT.html'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/cambridge-18/test-1/'IELTS18 Test 1 - Reading - GT.html'
          git commit -m "Wire IELTS 18 GT Test 1 study adapter"
          git push origin HEAD:feature/ielts18-gt-test1-study-feedback
