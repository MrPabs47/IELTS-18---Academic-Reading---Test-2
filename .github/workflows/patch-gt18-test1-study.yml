name: Patch IELTS 18 GT Test 1 Study integration

on:
  push:
    paths:
      - '.gt18-test1-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ielts18-gt-test1-study-feedback
      - name: Remove redundant local logo wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('general-training/cambridge-18/test-1/study-feedback.js')
          text = path.read_text(encoding='utf-8')

          for line in [
              "    '.logo.home-link,.logo-link .logo{transition:color .2s ease,opacity .2s ease}' +\n",
              "    '.logo.home-link:hover,.home-link:hover,.logo-link:hover .logo{color:#e31837;opacity:1}' +\n",
              "    '.logo-char{display:inline-block;opacity:1;transform:none;filter:none;will-change:transform,opacity,filter}' +\n",
              "    '.logo.is-animating .logo-char{animation:gt18LogoReveal .45s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--logo-char-index) * 200ms)}' +\n",
              "    '@keyframes gt18LogoReveal{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}' +\n",
              "    '@media(prefers-reduced-motion:reduce){.logo-char{opacity:1;transform:none;filter:none;animation:none!important}}' +\n",
          ]:
              text = text.replace(line, '')

          start = text.find('  function prepareAnimatedLogo() {\n')
          if start != -1:
              end = text.find('  function syncCandidateHeader() {\n', start)
              if end == -1:
                  raise SystemExit('Could not locate end of redundant logo wrapper')
              text = text[:start] + text[end:]

          text = text.replace('    prepareCandidateHeader();\n    prepareAnimatedLogo();\n', '    prepareCandidateHeader();\n', 1)

          if 'prepareAnimatedLogo' in text or 'gt18LogoReveal' in text:
              raise SystemExit('Redundant local logo code remains')

          path.write_text(text, encoding='utf-8')
          PY
          node --check general-training/cambridge-18/test-1/study-feedback.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/cambridge-18/test-1/study-feedback.js
          if git diff --cached --quiet; then
            echo "No redundant logo code remained"
            exit 0
          fi
          git commit -m "Preserve existing IELTS 18 logo implementation"
          git push origin HEAD:feature/ielts18-gt-test1-study-feedback
