name: GT19 Test 1 summary gap QA

on:
  push:
    branches:
      - fix/gt19-test1-summary-gap
    paths:
      - .gt19-test1-gap-repro/**
      - tests/gt19_test1_summary_feedback_spacing_test.py
      - .github/workflows/gt19-test1-summary-gap-repro.yml

jobs:
  browser-and-static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-test1-summary-gap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated QA dependencies
        run: |
          npm install --prefix /tmp/gt19-test1-playwright playwright@1.55.0
          npx --prefix /tmp/gt19-test1-playwright playwright install --with-deps chromium
          python -m pip install pytest
      - name: Validate Test 1 summary layout in Chromium
        env:
          NODE_PATH: /tmp/gt19-test1-playwright/node_modules
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/gt19-test1-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .gt19-test1-gap-repro/qa.cjs
      - name: Run focused spacing regression test
        run: python -m pytest -q tests/gt19_test1_summary_feedback_spacing_test.py
