name: Run staged Test 3 mode polish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/run-test3-mode-polish.yml

permissions:
  contents: write

jobs:
  run-staged-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gt19-test3-test-mode-polish
          fetch-depth: 0

      - name: Synchronise late Study controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/test3-mode-polish.sh')
          text = path.read_text(encoding='utf-8')
          old = '''    candidate.title = name;
    candidate.hidden = currentMode !== "test" || !name;
  }
'''
          new = '''    candidate.title = name;
    candidate.hidden = currentMode !== "test" || !name;
    document.querySelectorAll(".reading-shell-study-controls").forEach(function (controls) {
      var hideForTest = currentMode === "test";
      controls.hidden = hideForTest;
      controls.style.display = hideForTest ? "none" : "";
      controls.setAttribute("aria-hidden", hideForTest ? "true" : "false");
    });
  }
'''
          if text.count(old) != 1:
              raise SystemExit('Expected Test 3 mode synchroniser exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply patch and run browser regression
        shell: bash
        run: bash .github/scripts/test3-mode-polish.sh

      - name: Commit validated fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-test3-mode-polish.yml
          rm .github/workflows/run-test3-mode-polish.yml
          rm .github/scripts/test3-mode-polish.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add general-training/shared/gt-reading-test-runtime.js \
            .github/workflows/apply-test3-mode-polish.yml \
            .github/workflows/run-test3-mode-polish.yml \
            .github/scripts/test3-mode-polish.sh
          git commit -m 'Polish IELTS 19 GT Test 3 test mode'
          git push origin HEAD:agent/fix-gt19-test3-test-mode-polish
