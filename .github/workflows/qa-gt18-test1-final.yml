name: QA IELTS 18 GT Test 1 final head

on:
  push:
    paths:
      - '.gt18-test1-final-qa-trigger'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ielts18-gt-test1-study-feedback
      - name: Install browser runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run final-head browser parity QA
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/gt18-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat >/tmp/gt18-final-qa.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const URL = 'http://127.0.0.1:8000/general-training/cambridge-18/test-1/IELTS18%20Test%201%20-%20Reading%20-%20GT.html';
          const CLUE = '.reading-shell-study-clue-button';
          const FEEDBACK = '.reading-shell-study-feedback-card';
          function assert(ok, message) { if (!ok) throw new Error(message); }
          async function visibleCount(page, selector) {
            return page.locator(selector).evaluateAll(nodes => nodes.filter(node => {
              const style = getComputedStyle(node);
              return !node.hidden && style.display !== 'none' && style.visibility !== 'hidden' && node.getClientRects().length > 0;
            }).length);
          }
          async function openPage(browser, viewport, reducedMotion='no-preference') {
            const page = await browser.newPage({ viewport, reducedMotion });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('console: ' + msg.text()); });
            await page.goto(URL, { waitUntil: 'networkidle' });
            return { page, errors };
          }
          async function section(page, n, strategies, clues, feedback) {
            await page.evaluate(value => switchSection(value), n);
            await page.waitForTimeout(80);
            assert(await visibleCount(page, '.reading-shell-study-icon-button') === strategies, `S${n} strategies`);
            assert(await visibleCount(page, CLUE) === clues, `S${n} clues`);
            if (feedback !== undefined) assert(await visibleCount(page, FEEDBACK) === feedback, `S${n} feedback`);
          }
          async function fits(page, selector, width) {
            const box = await page.locator(selector).boundingBox();
            assert(box && box.x >= -1 && box.x + box.width <= width + 1, `${selector} overflow`);
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });

            {
              const { page, errors } = await openPage(browser, { width: 1440, height: 1000 });
              await page.locator('.mode-btn[data-mode="study"]').click();
              await page.waitForTimeout(220);
              assert((await page.evaluate(() => ReadingFeatureShell.getStatus())).initialized, 'Study shell init');
              assert(await page.locator('.reading-shell-study-icon-button').count() === 7, '7 strategies total');
              assert(await page.locator(CLUE).count() === 40, '40 clues total');
              assert(await page.locator(FEEDBACK).count() === 40, '40 feedback cards total');
              await section(page, 1, 2, 14, 14); await section(page, 2, 2, 13, 13); await section(page, 3, 3, 13, 13); await section(page, 1, 2, 14, 14);
              await page.locator('.reading-shell-score-guide-button').click(); await page.waitForTimeout(70);
              assert((await page.locator('.reading-shell-score-guide-dialog').innerText()).includes('Below 3'), 'Study score guide Below 3'); await page.keyboard.press('Escape');
              await page.locator('.reading-shell-answer-key-button').click(); await page.waitForTimeout(70);
              assert(await page.locator('.reading-shell-answer-key-item').count() === 40, '40 Answer Key items'); await page.keyboard.press('Escape');
              await page.locator(`${CLUE}:visible`).first().click(); await page.waitForTimeout(90);
              assert(await page.locator('#text-s1-dry-cleaning .reading-shell-evidence-highlight').count() >= 1, 'Q1 clue highlight');
              await page.locator('#primarySubmitBtn').click(); await page.waitForTimeout(120); assert(await page.locator('#resultsOverlay').isVisible(), 'Study results first');
              await page.locator('#resultsCloseBtn').click(); await page.locator('#primarySubmitBtn').click(); await page.waitForTimeout(120); assert(await page.locator('#resultsOverlay').isVisible(), 'Study results repeat');
              await page.locator('#resultsCloseBtn').click();
              assert(errors.length === 0, 'Study errors: ' + errors.join(' | '));
              console.log('PASS final-head Study lifecycle/resources');
              await page.close();
            }

            {
              const { page, errors } = await openPage(browser, { width: 1440, height: 1000 });
              await page.evaluate(() => { studentName='QA Candidate Long Name For Header Truncation'; startTest('test'); isTestRunning=true; }); await page.waitForTimeout(220);
              assert(await visibleCount(page, '#candidateNameDisplay') === 1, 'candidate header');
              assert(await visibleCount(page, '.reading-shell-study-icon-button') === 0, 'active Test strategies');
              assert(await visibleCount(page, CLUE) === 0, 'active Test clues');
              assert(await visibleCount(page, FEEDBACK) === 0, 'active Test feedback');
              assert(await visibleCount(page, '.reading-shell-score-guide-button') === 0, 'active Test score guide');
              assert(await visibleCount(page, '.reading-shell-answer-key-button') === 0, 'active Test key');
              await page.locator('.passage-match-source[data-value="A"]').click(); await page.locator('.drop-zone[data-for="q8"]').click(); assert(await page.locator('select[name="q8"]').inputValue()==='A','click-to-place');
              await page.locator('.drop-zone[data-for="q9"]').focus(); await page.keyboard.press('f'); assert(await page.locator('select[name="q9"]').inputValue()==='F','keyboard');
              await page.locator('.drop-zone[data-for="q10"]').focus(); await page.keyboard.press('a'); assert(await page.locator('select[name="q10"]').inputValue()==='A','reuse');
              await page.locator('.drop-zone[data-for="q8"]').locator('..').locator('.gt-section1-clear').click(); assert(await page.locator('select[name="q8"]').inputValue()==='','clear');
              await page.locator('.passage-match-source[data-value="B"]').dragTo(page.locator('.drop-zone[data-for="q8"]')); assert(await page.locator('select[name="q8"]').inputValue()==='B','drag');
              page.once('dialog', d=>d.accept()); await page.locator('#primarySubmitBtn').click(); await page.waitForTimeout(350);
              assert(await page.evaluate(() => testSubmitted), 'submitted'); assert((await page.locator('#bandLine').innerText()).includes('Below 3'),'result Below 3');
              await page.locator('#resultsCloseBtn').click(); await page.waitForTimeout(180); await section(page,1,2,14,14);
              assert(await visibleCount(page,'.reading-shell-score-feedback-button')===1,'score feedback visible');
              await page.locator('.reading-shell-score-feedback-button').click(); await page.waitForTimeout(90); const score=await page.locator('.reading-shell-score-feedback-dialog').innerText();
              assert(score.includes('Submitted band: Below 3.'),'feedback Below 3'); assert(score.includes('Performance by section'),'feedback Section wording'); await page.keyboard.press('Escape');
              await section(page,2,2,13,13); await section(page,3,3,13,13); await section(page,1,2,14,14);
              assert(await page.locator('#primarySubmitBtn').isDisabled(),'submit lock'); assert(await page.locator('.gt-section1-clear').evaluateAll(xs=>xs.every(x=>x.disabled)),'clear lock');
              assert(await page.locator('.passage-match-source').evaluateAll(xs=>xs.every(x=>!x.draggable && x.getAttribute('aria-disabled')==='true')),'source lock'); assert(await page.locator('select[name="q8"]').isDisabled(),'native lock');
              const frozen=await page.locator('select[name="q8"]').inputValue(); await page.locator('.passage-match-source[data-value="A"]').click({force:true}).catch(()=>{}); await page.locator('.drop-zone[data-for="q8"]').click({force:true}).catch(()=>{}); assert(await page.locator('select[name="q8"]').inputValue()===frozen,'immutable lock');
              assert(errors.length===0,'Test errors: '+errors.join(' | ')); console.log('PASS final-head Test/matching/Below3/lock'); await page.close();
            }

            {
              const { page, errors } = await openPage(browser,{width:390,height:844}); await page.locator('.mode-btn[data-mode="study"]').click(); await page.waitForTimeout(180);
              for (const theme of ['black-on-white','white-on-black','yellow-on-black']) { await page.evaluate(v=>setTheme(v),theme); await page.evaluate(()=>setFontSize('xlarge')); await page.locator('.reading-shell-score-guide-button').click(); await page.waitForTimeout(50); await fits(page,'.reading-shell-score-guide-dialog',390); await page.keyboard.press('Escape'); await page.locator('.reading-shell-answer-key-button').click(); await page.waitForTimeout(50); await fits(page,'.reading-shell-answer-key-dialog',390); await page.keyboard.press('Escape'); }
              assert(errors.length===0,'narrow errors: '+errors.join(' | ')); console.log('PASS final-head narrow/themes/xlarge'); await page.close();
            }

            {
              const { page, errors }=await openPage(browser,{width:1200,height:800}); await page.locator('.mode-btn[data-mode="study"]').click(); const logo=page.locator('.logo.home-link'); assert(await logo.locator('.logo-char').count()===10,'logo chars'); assert(await logo.getAttribute('tabindex')==='0','logo tabindex'); assert(await logo.getAttribute('role')==='link','logo role'); await logo.hover(); await page.waitForTimeout(40); assert(await logo.evaluate(el=>el.classList.contains('is-animating')),'logo animation'); await page.mouse.move(800,700); assert(errors.length===0,'logo errors'); console.log('PASS final-head existing logo parity'); await page.close();
            }
            {
              const { page, errors }=await openPage(browser,{width:1200,height:800},'reduce'); await page.locator('.mode-btn[data-mode="study"]').click(); const logo=page.locator('.logo.home-link'); await logo.hover(); await page.waitForTimeout(40); assert(!(await logo.evaluate(el=>el.classList.contains('is-animating'))),'reduced motion'); assert(errors.length===0,'reduced errors'); console.log('PASS final-head logo reduced-motion'); await page.close();
            }

            await browser.close(); console.log('PASS IELTS 18 GT Reading Test 1 final-head browser parity QA');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/gt18-final-qa.cjs
