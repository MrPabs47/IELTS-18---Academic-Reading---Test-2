name: Apply Test 3 passage heading drag fix

on:
  push:
    branches:
      - agent/fix-gt19-test3-passage-heading-drag
    paths:
      - .github/workflows/apply-test3-passage-heading-drag.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gt19-test3-passage-heading-drag
          fetch-depth: 0

      - name: Reuse the passage-source matching interaction
        shell: bash
        run: |
          cat > /tmp/test3-drag-replacement.js <<'JS'
            function parseBankRange(bank) {
              var label = bank.getAttribute("aria-label") || "";
              var match = label.match(/questions?\s+(\d+)\s+(?:to|–|-)\s+(\d+)/i);
              if (!match) return null;
              return { from: Number(match[1]), to: Number(match[2]) };
            }

            function normalPassageHeadingText(value) {
              return String(value || "").replace(/\s+/g, " ").trim();
            }

            function passageHeadingParagraphs(parent) {
              if (!parent) return [];
              return Array.from(parent.children).filter(function (node) {
                return node.tagName === "P" && node.firstElementChild && node.firstElementChild.tagName === "STRONG";
              });
            }

            function installTest3DragMatching() {
              if (!isTest3Page() || document.documentElement.getAttribute("data-gt-drag-upgrade") === "true") return;

              var section = document.querySelector('.passage-section[data-section="1"]');
              var divider = section && section.querySelector(":scope > .passage-divider");
              var banks = Array.from(document.querySelectorAll('#questionContent > [data-section="1"] .drag-bank'));
              var groups = [
                { range: { from: 1, to: 8 }, paragraphs: passageHeadingParagraphs(section).slice(0, 5) },
                { range: { from: 9, to: 14 }, paragraphs: passageHeadingParagraphs(divider).slice(0, 4) }
              ];

              if (!section || !divider || banks.length < 2 || groups[0].paragraphs.length !== 5 || groups[1].paragraphs.length !== 4) return;

              document.documentElement.setAttribute("data-gt-drag-upgrade", "true");
              var bankRecords = [];
              var selectedByBank = new Map();
              var activeDrag = null;

              groups.forEach(function (group, index) {
                var bank = banks.find(function (candidate) {
                  var range = parseBankRange(candidate);
                  return range && range.from === group.range.from && range.to === group.range.to;
                }) || banks[index];
                if (!bank) return;

                var id = "gt-passage-source-group-" + (index + 1);
                var sources = [];

                group.paragraphs.forEach(function (paragraph) {
                  var strong = paragraph.firstElementChild;
                  var rawLabel = normalPassageHeadingText(strong && strong.textContent);
                  var match = rawLabel.match(/^([A-Z])\s+(.+)$/);
                  if (!match) return;

                  var value = match[1];
                  var title = match[2];
                  var source = document.createElement("button");
                  source.type = "button";
                  source.className = "drag-item passage-match-source passage-heading-source";
                  source.draggable = true;
                  source.setAttribute("data-value", value);
                  source.setAttribute("data-source-label", rawLabel);
                  source.setAttribute("data-gt-drag-bank", id);
                  source.setAttribute("aria-label", "Choose " + rawLabel + " for Questions " + group.range.from + " to " + group.range.to);
                  source.setAttribute("aria-pressed", "false");

                  var letter = document.createElement("span");
                  letter.className = "passage-heading-letter";
                  letter.textContent = value;
                  var wording = document.createElement("span");
                  wording.className = "passage-heading-wording";
                  wording.textContent = title;
                  source.append(letter, wording);

                  paragraph.parentNode.insertBefore(source, paragraph);
                  strong.remove();
                  if (paragraph.firstChild && paragraph.firstChild.nodeType === Node.TEXT_NODE) {
                    paragraph.firstChild.nodeValue = paragraph.firstChild.nodeValue.replace(/^\s+/, "");
                  }
                  paragraph.classList.add("passage-heading-body");
                  sources.push(source);
                });

                if (!sources.length) return;
                bankRecords.push({ id: id, bank: bank, range: group.range, sources: sources });

                var sourceLabels = new Set(sources.map(function (source) {
                  return normalPassageHeadingText(source.getAttribute("data-source-label"));
                }));
                var sibling = bank.previousElementSibling;
                while (sibling && sibling.tagName === "P") {
                  var previous = sibling.previousElementSibling;
                  if (!sourceLabels.has(normalPassageHeadingText(sibling.textContent))) break;
                  sibling.hidden = true;
                  sibling.classList.add("passage-option-list-hidden");
                  sibling = previous;
                }

                bank.hidden = true;
                bank.style.display = "none";
                bank.setAttribute("aria-hidden", "true");
              });

              function recordForQuestion(questionNumber) {
                return bankRecords.find(function (record) {
                  return questionNumber >= record.range.from && questionNumber <= record.range.to;
                }) || null;
              }

              function recordForNode(node) {
                var id = node && node.getAttribute && node.getAttribute("data-gt-drag-bank");
                return bankRecords.find(function (record) { return record.id === id; }) || null;
              }

              function sourceForValue(record, value) {
                return record && record.sources.find(function (source) {
                  return source.getAttribute("data-value") === value;
                });
              }

              function zoneQuestion(zone) {
                return Number(String(zone.getAttribute("data-for") || "").replace(/^q/, ""));
              }

              function selectForZone(zone) {
                return document.querySelector('select[name="' + zone.getAttribute("data-for") + '"]');
              }

              function locked(node, select) {
                return Boolean(
                  (select && select.disabled) ||
                  (node && node.classList.contains("reading-shell-locked")) ||
                  (node && node.getAttribute("aria-disabled") === "true")
                );
              }

              function clearSelections() {
                selectedByBank.clear();
                document.querySelectorAll(".passage-heading-source.selected").forEach(function (source) {
                  source.classList.remove("selected");
                  source.setAttribute("aria-pressed", "false");
                });
              }

              function choose(source) {
                var record = recordForNode(source);
                if (!record || locked(source, null)) return false;
                clearSelections();
                selectedByBank.set(record.id, source.getAttribute("data-value"));
                source.classList.add("selected");
                source.setAttribute("aria-pressed", "true");
                return true;
              }

              function apply(zone, value, sourceRecord) {
                var question = zoneQuestion(zone);
                var targetRecord = recordForQuestion(question);
                var select = selectForZone(zone);
                if (!targetRecord || !select || locked(zone, select)) return false;
                if (sourceRecord && sourceRecord.id !== targetRecord.id) return false;
                var allowed = Array.from(select.options).some(function (option) { return option.value === value; });
                if (!allowed) return false;

                var source = sourceForValue(targetRecord, value);
                var label = source ? source.getAttribute("data-source-label") : value;
                select.value = value;
                select.dispatchEvent(new Event("change", { bubbles: true }));
                zone.textContent = label;
                zone.setAttribute("data-answer-value", value);
                zone.classList.add("filled", "passage-heading-drop-zone");
                zone.setAttribute("aria-label", label + " selected for Question " + question + ". Press Delete to clear.");
                clearSelections();
                return true;
              }

              function clear(zone) {
                var question = zoneQuestion(zone);
                var select = selectForZone(zone);
                if (!select || locked(zone, select)) return false;
                select.value = "";
                select.dispatchEvent(new Event("change", { bubbles: true }));
                zone.textContent = "Drop here";
                zone.removeAttribute("data-answer-value");
                zone.classList.remove("filled", "over");
                zone.setAttribute("aria-label", "Answer box for question " + question);
                clearSelections();
                return true;
              }

              document.addEventListener("dragstart", function (event) {
                var source = event.target.closest && event.target.closest(".passage-heading-source[data-gt-drag-bank]");
                if (!source) return;
                event.stopImmediatePropagation();
                if (!choose(source)) {
                  event.preventDefault();
                  return;
                }
                var record = recordForNode(source);
                activeDrag = { record: record, value: source.getAttribute("data-value") };
                source.classList.add("is-dragging");
                if (event.dataTransfer) {
                  event.dataTransfer.effectAllowed = "copy";
                  event.dataTransfer.setData("text/plain", activeDrag.value);
                  event.dataTransfer.setData("application/x-gt-reading-bank", record.id);
                }
              }, true);

              document.addEventListener("dragend", function (event) {
                var source = event.target.closest && event.target.closest(".passage-heading-source[data-gt-drag-bank]");
                if (!source) return;
                event.stopImmediatePropagation();
                source.classList.remove("is-dragging");
                activeDrag = null;
                document.querySelectorAll(".drop-zone.over").forEach(function (zone) { zone.classList.remove("over"); });
              }, true);

              document.addEventListener("dragover", function (event) {
                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                var targetRecord = recordForQuestion(zoneQuestion(zone));
                var select = selectForZone(zone);
                if (!activeDrag || !targetRecord || activeDrag.record.id !== targetRecord.id || locked(zone, select)) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                zone.classList.add("over");
                if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
              }, true);

              document.addEventListener("dragleave", function (event) {
                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                event.stopImmediatePropagation();
                zone.classList.remove("over");
              }, true);

              document.addEventListener("drop", function (event) {
                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                zone.classList.remove("over");
                var bankId = event.dataTransfer && event.dataTransfer.getData("application/x-gt-reading-bank");
                var value = event.dataTransfer && event.dataTransfer.getData("text/plain");
                var sourceRecord = bankRecords.find(function (record) { return record.id === bankId; }) || (activeDrag && activeDrag.record);
                apply(zone, value || (activeDrag && activeDrag.value), sourceRecord);
                activeDrag = null;
              }, true);

              document.addEventListener("click", function (event) {
                var source = event.target.closest && event.target.closest(".passage-heading-source[data-gt-drag-bank]");
                if (source) {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  choose(source);
                  return;
                }

                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                var record = recordForQuestion(zoneQuestion(zone));
                var selected = record && selectedByBank.get(record.id);
                if (selected) apply(zone, selected, record);
                else if (selectedByBank.size > 0) return;
                else if (zone.classList.contains("filled")) clear(zone);
              }, true);

              document.addEventListener("dblclick", function (event) {
                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                clear(zone);
              }, true);

              document.addEventListener("keydown", function (event) {
                var source = event.target.closest && event.target.closest(".passage-heading-source[data-gt-drag-bank]");
                if (source && (event.key === "Enter" || event.key === " ")) {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  choose(source);
                  return;
                }

                var zone = event.target.closest && event.target.closest(".drop-zone[data-gt-drag-bank]");
                if (!zone) return;
                var key = String(event.key || "");
                if (key === "Backspace" || key === "Delete") {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  clear(zone);
                  return;
                }
                if (!/^[a-z]$/i.test(key)) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                var record = recordForQuestion(zoneQuestion(zone));
                apply(zone, key.toUpperCase(), record);
              }, true);

              document.querySelectorAll(".drop-zone").forEach(function (zone) {
                var question = zoneQuestion(zone);
                var record = recordForQuestion(question);
                if (!record) return;
                zone.setAttribute("data-gt-drag-bank", record.id);
                zone.classList.add("passage-heading-drop-zone");
                var select = selectForZone(zone);
                if (select && select.value) apply(zone, select.value, record);
              });
            }
          JS

          python - <<'PY'
          from pathlib import Path

          path = Path('general-training/shared/gt-reading-test-runtime.js')
          text = path.read_text(encoding='utf-8')

          old_styles = (
              '      ".drag-item.passage-match-source{cursor:grab}" +\n'
              '      ".drag-item.passage-match-source:focus-visible,.drop-zone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}" +\n'
              '      ".drag-item.passage-match-source.reading-shell-locked,.drop-zone.reading-shell-locked{cursor:not-allowed;opacity:.72}";'
          )
          new_styles = (
              '      ".drag-item.passage-match-source{cursor:grab}" +\n'
              '      ".passage-heading-source{align-items:flex-start;background:color-mix(in srgb,var(--bg) 94%,var(--bg-secondary));border:1px solid var(--border);border-radius:7px;color:var(--text);display:flex;font:inherit;font-weight:700;gap:8px;line-height:1.35;margin:14px 0 6px;padding:6px 9px;text-align:left;width:100%}" +\n'
              '      ".passage-heading-source:hover,.passage-heading-source.selected,.passage-heading-source:focus-visible{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}" +\n'
              '      ".passage-heading-source.is-dragging{opacity:.68}" +\n'
              '      ".passage-heading-letter{flex:0 0 auto;font-weight:800}" +\n'
              '      ".passage-heading-wording{min-width:0}" +\n'
              '      ".passage-heading-body{margin-top:0!important}" +\n'
              '      ".passage-heading-drop-zone{justify-content:flex-start;line-height:1.35;max-width:100%;min-height:42px;text-align:left;white-space:normal;width:min(100%,430px)}" +\n'
              '      ".passage-heading-drop-zone.filled{font-weight:700}" +\n'
              '      ".drag-item.passage-match-source:focus-visible,.drop-zone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}" +\n'
              '      ".drag-item.passage-match-source.reading-shell-locked,.drop-zone.reading-shell-locked{cursor:not-allowed;opacity:.72}";'
          )
          if text.count(old_styles) != 1:
              raise SystemExit('Expected runtime style anchor was not found exactly once')
          text = text.replace(old_styles, new_styles, 1)

          start = text.index('  function parseBankRange(bank) {')
          end = text.index('  function init() {', start)
          replacement = Path('/tmp/test3-drag-replacement.js').read_text(encoding='utf-8') + '\n'
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Static contract checks
        shell: bash
        run: |
          node --check general-training/shared/gt-reading-test-runtime.js
          grep -q 'passage-heading-source' general-training/shared/gt-reading-test-runtime.js
          grep -q 'data-source-label' general-training/shared/gt-reading-test-runtime.js
          grep -q 'bank.style.display = "none"' general-training/shared/gt-reading-test-runtime.js
          grep -q 'Find (CTRL + F) is disabled in Test mode.' general-training/shared/gt-reading-test-runtime.js
          grep -q 'installLogoHomeLink' general-training/shared/gt-reading-test-runtime.js
          git diff --check

      - name: Browser interaction regression
        shell: bash
        run: |
          npm install --prefix /tmp/test3-passage-drag --no-save puppeteer-core@24.16.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/test3-passage-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > /tmp/test3-passage-drag.js <<'NODE'
          const puppeteer = require('/tmp/test3-passage-drag/node_modules/puppeteer-core');
          const assert = require('assert');

          async function dragByEvents(page, sourceSelector, zoneSelector) {
            await page.evaluate(({ sourceSelector, zoneSelector }) => {
              const source = document.querySelector(sourceSelector);
              const zone = document.querySelector(zoneSelector);
              if (!source || !zone) throw new Error('Missing drag source or target');
              const dataTransfer = new DataTransfer();
              source.dispatchEvent(new DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer }));
              zone.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer }));
              zone.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer }));
              source.dispatchEvent(new DragEvent('dragend', { bubbles: true, cancelable: true, dataTransfer }));
            }, { sourceSelector, zoneSelector });
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox']
            });
            const page = await browser.newPage();
            const errors = [];
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('pageerror', error => errors.push(error.message));

            const url = 'http://127.0.0.1:8765/general-training/cambridge-19/test-3/IELTS19%20Test%203%20-%20Reading%20-%20GT.html';
            await page.goto(url, { waitUntil: 'networkidle0' });
            await page.click('[data-mode="study"]');
            await page.waitForFunction(() => document.querySelectorAll('.passage-heading-source').length === 9);

            const contract = await page.evaluate(() => {
              const sources = [...document.querySelectorAll('.passage-heading-source')];
              const banks = [...document.querySelectorAll('#questionContent > [data-section="1"] .drag-bank')];
              const first = sources[0];
              const sports = sources[5];
              return {
                count: sources.length,
                values: sources.map(source => source.dataset.value).join(''),
                labels: sources.map(source => source.dataset.sourceLabel),
                banksHidden: banks.every(bank => getComputedStyle(bank).display === 'none'),
                duplicateOptionsHidden: document.querySelectorAll('.passage-option-list-hidden[hidden]').length,
                firstBodyBelow: first.nextElementSibling && first.nextElementSibling.tagName === 'P' &&
                  first.nextElementSibling.getBoundingClientRect().top >= first.getBoundingClientRect().bottom,
                firstBodyStarts: first.nextElementSibling && first.nextElementSibling.textContent.trim().slice(0, 24),
                sportsBodyBelow: sports.nextElementSibling && sports.nextElementSibling.tagName === 'P' &&
                  sports.nextElementSibling.getBoundingClientRect().top >= sports.getBoundingClientRect().bottom,
                zones: document.querySelectorAll('#questionContent > [data-section="1"] .drop-zone[data-gt-drag-bank]').length,
                logoCursor: getComputedStyle(document.querySelector('.logo.home-link')).cursor,
                guardMessagePresent: [...document.scripts].some(script => (script.src || '').includes('gt-reading-test-runtime.js'))
              };
            });

            assert.strictEqual(contract.count, 9);
            assert.strictEqual(contract.values, 'ABCDEABCD');
            assert.deepStrictEqual(contract.labels.slice(0, 2), ['A Purple Rainbow: The Truth', 'B Home Fires']);
            assert.strictEqual(contract.banksHidden, true);
            assert.strictEqual(contract.duplicateOptionsHidden, 9);
            assert.strictEqual(contract.firstBodyBelow, true);
            assert.strictEqual(contract.sportsBodyBelow, true);
            assert(contract.firstBodyStarts.startsWith('Having actors playing'));
            assert.strictEqual(contract.zones, 14);
            assert.strictEqual(contract.logoCursor, 'pointer');
            assert.strictEqual(contract.guardMessagePresent, true);

            await dragByEvents(page, '.passage-heading-source[data-gt-drag-bank="gt-passage-source-group-1"][data-value="A"]', '.drop-zone[data-for="q1"]');
            let q1 = await page.evaluate(() => ({
              value: document.querySelector('select[name="q1"]').value,
              text: document.querySelector('.drop-zone[data-for="q1"]').textContent.trim()
            }));
            assert.deepStrictEqual(q1, { value: 'A', text: 'A Purple Rainbow: The Truth' });

            await dragByEvents(page, '.passage-heading-source[data-gt-drag-bank="gt-passage-source-group-1"][data-value="A"]', '.drop-zone[data-for="q2"]');
            const reused = await page.evaluate(() => [
              document.querySelector('select[name="q1"]').value,
              document.querySelector('select[name="q2"]').value
            ]);
            assert.deepStrictEqual(reused, ['A', 'A']);

            await dragByEvents(page, '.passage-heading-source[data-gt-drag-bank="gt-passage-source-group-2"][data-value="C"]', '.drop-zone[data-for="q9"]');
            const q9 = await page.evaluate(() => ({
              value: document.querySelector('select[name="q9"]').value,
              text: document.querySelector('.drop-zone[data-for="q9"]').textContent.trim()
            }));
            assert.deepStrictEqual(q9, { value: 'C', text: 'C Race Drive Experience' });

            await page.click('.passage-heading-source[data-gt-drag-bank="gt-passage-source-group-1"][data-value="B"]');
            await page.click('.drop-zone[data-for="q3"]');
            const q3 = await page.evaluate(() => document.querySelector('select[name="q3"]').value);
            assert.strictEqual(q3, 'B');

            await page.focus('.drop-zone[data-for="q3"]');
            await page.keyboard.press('Delete');
            const cleared = await page.evaluate(() => ({
              value: document.querySelector('select[name="q3"]').value,
              text: document.querySelector('.drop-zone[data-for="q3"]').textContent.trim()
            }));
            assert.deepStrictEqual(cleared, { value: '', text: 'Drop here' });

            await page.evaluate(() => {
              window.startTest('test');
              window.isTestRunning = true;
              window.testSubmitted = false;
            });
            await page.keyboard.down('Control');
            await page.keyboard.press('f');
            await page.keyboard.up('Control');
            await page.waitForFunction(() => {
              const toast = document.getElementById('shortcutToast');
              return toast && toast.classList.contains('visible');
            });
            const toast = await page.$eval('#shortcutToast', element => element.textContent.trim());
            assert.strictEqual(toast, 'Find (CTRL + F) is disabled in Test mode.');

            assert.deepStrictEqual(errors, []);
            await browser.close();
            console.log('Test 3 passage-heading drag regression: PASS');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          CHROME_BIN="$CHROME_BIN" node /tmp/test3-passage-drag.js

      - name: Commit tested runtime and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-test3-passage-heading-drag.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add general-training/shared/gt-reading-test-runtime.js \
                  .github/workflows/apply-test3-passage-heading-drag.yml
          git commit -m 'Use passage headings as Test 3 drag sources'
          git push origin HEAD:agent/fix-gt19-test3-passage-heading-drag
