name: Fix GT Reading documentation line breaks

on:
  push:
    paths:
      - '.gt-reading-doc-breaks-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-regression-lessons-2026-08-08
      - name: Preserve metadata line breaks without trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md')
          text = path.read_text(encoding='utf-8')
          old1 = '**Focused regression releases:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment; PR #473 — IELTS 18 GT Test 1 internal modal-overflow regression\n'
          new1 = '**Focused regression releases:** PR #436 — Test 3 header CSS inheritance and Study-dialog containment; PR #473 — IELTS 18 GT Test 1 internal modal-overflow regression<br>\n'
          old2 = '**Current reference commit:** `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`\n'
          new2 = '**Current reference commit:** `3f2a7a6f56db866a9c3c8fca493f2f3aa833c598`<br>\n'
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected metadata lines not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-training/shared/IELTS_GT_READING_FAST_TRACK_WORKFLOW.md
          git commit -m "Preserve GT Reading workflow metadata line breaks"
          git push origin HEAD:docs/gt-reading-regression-lessons-2026-08-08
