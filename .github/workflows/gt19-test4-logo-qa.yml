name: GT19 Test 4 logo QA

on:
  push:
    branches:
      - fix/gt19-test4-logo-animation
    paths:
      - general-training/cambridge-19/test-4/IELTS19 Test 4 - Reading - GT.html
      - tests/gt19_test4_logo_animation_test.py
      - .gt19-test4-logo-qa/**
      - .github/workflows/gt19-test4-logo-qa.yml

jobs:
  browser-and-static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gt19-test4-logo-animation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated QA dependencies
        run: |
          npm install --prefix /tmp/gt19-test4-playwright playwright@1.55.0
          npx --prefix /tmp/gt19-test4-playwright playwright install --with-deps chromium
          python -m pip install pytest
      - name: Validate Test 4 logo animation in Chromium
        env:
          NODE_PATH: /tmp/gt19-test4-playwright/node_modules
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/gt19-test4-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .gt19-test4-logo-qa/qa.cjs
      - name: Run focused regression test
        run: python -m pytest -q tests/gt19_test4_logo_animation_test.py
