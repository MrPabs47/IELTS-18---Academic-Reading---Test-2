name: Restore IELTS 19 GT clue controls cleanly

on:
  push:
    branches:
      - agent/restore-gt19-clue-controls-clean
    paths:
      - .github/workflows/restore-gt19-clue-controls-clean.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-gt19-clue-controls-clean
          fetch-depth: 0

      - name: Enable complete Study Mode clue coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('general-training/cambridge-19/test-1/study-feedback.js'),
              Path('general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html'),
          ]
          pattern = re.compile(r'(study:\s*\{\s*\n)(\s*)(taskGroups:)')

          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(
                  lambda match: (
                      match.group(1)
                      + match.group(2) + 'completeQuestionCoverage: true,\n'
                      + match.group(2) + 'completeClueCoverage: true,\n'
                      + match.group(2) + match.group(3)
                  ),
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not patch {path}')
              path.write_text(updated, encoding='utf-8')

          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert text.count('completeQuestionCoverage: true') == 1
              assert text.count('completeClueCoverage: true') == 1
              assert 'allowDomSubmittedResult: true' in text
          PY

      - name: Run static and browser checks
        shell: bash
        run: |
          node --check general-training/cambridge-19/test-1/study-feedback.js
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --prefix /tmp/gt19-clue-test --no-save puppeteer-core@24.16.0 >/dev/null
          cat > /tmp/gt19-clue-test/check.js <<'JS'
          const puppeteer = require('/tmp/gt19-clue-test/node_modules/puppeteer-core');
          const pages = [
            'general-training/cambridge-19/test-1/IELTS19%20Test%201%20-%20Reading%20-%20GT.html',
            'general-training/cambridge-19/test-2/IELTS19%20Test%202%20-%20Reading%20-%20GT.html'
          ];

          async function check(path) {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            try {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:8765/' + path, { waitUntil: 'networkidle0' });
              await page.waitForFunction(() => Array.from(document.querySelectorAll('button')).some(button => /study/i.test(button.textContent || '')));
              await page.evaluate(() => {
                const button = Array.from(document.querySelectorAll('button')).find(node => /study/i.test(node.textContent || ''));
                button.click();
              });
              await page.waitForFunction(() => document.getElementById('app') && getComputedStyle(document.getElementById('app')).display !== 'none');
              await page.evaluate(() => window.submitTest());
              await page.waitForFunction(() => document.querySelectorAll('.reading-shell-study-clue-button').length === 40);
              const state = await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('.reading-shell-study-clue-button'));
                const toggle = document.getElementById('passageClueToggle');
                return {
                  visible: buttons.filter(button => !button.hidden && !button.disabled).length,
                  toggle: Boolean(toggle && !toggle.hidden && !toggle.disabled)
                };
              });
              if (state.visible !== 40 || !state.toggle) throw new Error(path + ' clue controls incomplete: ' + JSON.stringify(state));
              await page.evaluate(() => document.querySelector('.reading-shell-study-clue-button').click());
              await page.waitForFunction(() => document.querySelector('.reading-shell-evidence-highlight'));
              console.log('Clue controls passed:', path);
            } finally {
              await browser.close();
            }
          }

          (async () => {
            for (const path of pages) await check(path);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gt19-clue-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$CHROME_BIN" node /tmp/gt19-clue-test/check.js

      - name: Commit only the tested fixes
        shell: bash
        run: |
          rm -f .github/workflows/restore-gt19-clue-controls-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            general-training/cambridge-19/test-1/study-feedback.js \
            "general-training/cambridge-19/test-2/IELTS19 Test 2 - Reading - GT.html" \
            .github/workflows/restore-gt19-clue-controls-clean.yml
          git commit -m "Restore IELTS 19 GT clue controls"
          git push origin HEAD:agent/restore-gt19-clue-controls-clean
