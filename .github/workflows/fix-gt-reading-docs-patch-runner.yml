name: Fix temporary GT Reading docs patch runner

on:
  push:
    branches:
      - docs/gt-reading-cambridge19-lessons
    paths:
      - .gt-reading-docs-patch/FIX

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gt-reading-cambridge19-lessons
      - name: Remove diff check from temporary Markdown patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-gt-reading-lessons-docs.yml')
          text = path.read_text(encoding='utf-8')
          old = '          git diff --check\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one temporary diff-check line, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-gt-reading-lessons-docs.yml
          git commit -m "Fix temporary GT Reading docs patch runner"
          git push origin HEAD:docs/gt-reading-cambridge19-lessons
