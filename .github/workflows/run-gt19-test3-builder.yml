name: Run IELTS 19 GT Test 3 builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-builder:
    if: github.head_ref == 'agent/add-gt19-test3-study-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gt19-test3-study-mode
          fetch-depth: 0

      - name: Execute the staged build and validation steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          raw = Path('.github/workflows/build-gt19-test3-study.yml').read_text(encoding='utf-8')
          pattern = re.compile(
              r'^      - name: (?P<name>[^\n]+)\n(?:(?!^      - name:).)*?^        run: \|\n(?P<body>.*?)(?=^      - name:|\Z)',
              re.MULTILINE | re.DOTALL,
          )
          steps = list(pattern.finditer(raw))
          if len(steps) < 6:
              raise SystemExit(f'Could only extract {len(steps)} staged run steps')

          for match in steps:
              name = match.group('name').strip()
              if name == 'Commit tested Test 3 files':
                  continue
              lines = []
              for line in match.group('body').splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              command = '\n'.join(lines).rstrip() + '\n'
              print(f'\n===== {name} =====', flush=True)
              subprocess.run(command, shell=True, executable='/bin/bash', check=True)
          PY

      - name: Commit only the tested Test 3 files
        shell: bash
        run: |
          rm -f .github/workflows/build-gt19-test3-study.yml
          rm -f .github/workflows/run-gt19-test3-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "general-training/cambridge-19/test-3/IELTS19 Test 3 - Reading - GT.html" \
            general-training/cambridge-19/test-3/study-feedback.js \
            general-training/cambridge-19/test-3/study-feedback-data.js \
            .github/workflows/build-gt19-test3-study.yml \
            .github/workflows/run-gt19-test3-builder.yml
          git commit -m "Add IELTS 19 GT Test 3 Study mode"
          git push origin HEAD:agent/add-gt19-test3-study-mode
