<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2880" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Number of participants, by activity 2000–2020</title>
<desc id="desc">Line graph comparing participation in film club, martial arts, amateur dramatics, table tennis and musical performances from 2000 to 2020.</desc>
<rect width="1600" height="1200" fill="#fff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:48px;font-weight:700;text-anchor:middle}.axis-label{font-size:38px;font-weight:700;text-anchor:middle}.tick{font-size:31px}.grid{stroke:#c8c8c8;stroke-width:1.5;stroke-dasharray:7 7}.axis{stroke:#111;stroke-width:3}.film{fill:none;stroke:#333;stroke-width:4}.martial{fill:none;stroke:#999;stroke-width:4;stroke-dasharray:12 10}.amateur{fill:none;stroke:#222;stroke-width:4;stroke-dasharray:2 8;stroke-linecap:round}.table{fill:none;stroke:#222;stroke-width:4;stroke-dasharray:15 6 3 6}.music{fill:none;stroke:#999;stroke-width:4}.open{fill:#fff;stroke:#222;stroke-width:3}.filled{fill:#333;stroke:#333;stroke-width:2}.legend{font-size:31px}.legend-box{fill:#fff;stroke:#777;stroke-width:2}
</style>
<text class="title" x="800" y="70">Number of participants, by activity 2000–2020</text>
