<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Southwest Airport now and after redevelopment</title>
  <desc id="desc">Two plans compare Southwest Airport now with its layout after redevelopment next year, including gates, passenger facilities and transport links.</desc>
  <rect width="900" height="900" fill="#fff"/>
  <defs>
    <style>
      .line{fill:none;stroke:#222;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#222;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .label{font:15px Arial,Helvetica,sans-serif;fill:#222}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#222}
      .gate{font:15px Arial,Helvetica,sans-serif;fill:#222}
      .heading{font:700 20px Arial,Helvetica,sans-serif;fill:#222}
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#222}
    </style>
    <g id="checkin">
      <circle cx="0" cy="0" r="12" fill="#fff" stroke="#222" stroke-width="1.7"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#222">C</text>
    </g>
    <g id="bagdrop">
      <circle cx="0" cy="0" r="12" fill="#fff" stroke="#222" stroke-width="1.7"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#222">B</text>
    </g>
    <g id="cafe">
      <rect x="-11" y="-8" width="18" height="13" rx="1" fill="#fff" stroke="#222" stroke-width="1.6"/>
      <path d="M7-5h5c5 0 5 7 0 7H7" class="thin"/>
      <line x1="-13" y1="8" x2="12" y2="8" class="thin"/>
    </g>
    <g id="walkway">
      <rect x="-13" y="-13" width="26" height="26" fill="#fff" stroke="#222" stroke-width="1.6"/>
      <circle cx="-2" cy="-6" r="2.5" fill="#222"/>
      <path d="M-2-3v7m0-4 6 3m-6 1-5 7m5-7 6 7" class="thin"/>
      <path d="M-10 10h20M6 7l4 3-4 3" class="thin"/>
    </g>
    <g id="train">
      <rect x="-12" y="-13" width="24" height="26" rx="3" fill="#fff" stroke="#222" stroke-width="1.6"/>
      <rect x="-7" y="-8" width="14" height="8" fill="none" stroke="#222" stroke-width="1.3"/>
      <circle cx="-6" cy="7" r="2" fill="#222"/><circle cx="6" cy="7" r="2" fill="#222"/>
      <path d="M-8 13l-4 5m20-5 4 5" class="thin"/>
    </g>
    <g id="atm">
      <rect x="-12" y="-12" width="24" height="24" fill="#fff" stroke="#222" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#222">$</text>
    </g>
    <g id="car">
      <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <path d="M-8-6l4-7h10l6 7" class="thin"/>
      <circle cx="-8" cy="7" r="3" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <circle cx="9" cy="7" r="3" fill="#fff" stroke="#222" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="450" y="42" text-anchor="middle" class="title">SOUTHWEST AIRPORT</text>
  <text x="210" y="92" text-anchor="middle" class="heading">NOW</text>
  <text x="655" y="92" text-anchor="middle" class="heading">AFTER DEVELOPMENT</text>

  <!-- NOW: terminal -->
  <rect x="55" y="485" width="320" height="190" class="line"/>
  <line x1="215" y1="485" x2="215" y2="675" class="line"/>
  <line x1="55" y1="535" x2="375" y2="535" class="thin"/>
  <line x1="55" y1="570" x2="375" y2="570" class="thin"/>
  <text x="60" y="508" class="small">SECURITY</text>
  <text x="60" y="558" class="small">PASSPORT CONTROL</text>
  <text x="222" y="508" class="small">PASSPORT CONTROL</text>
  <text x="222" y="558" class="small">CUSTOMS</text>
  <use href="#checkin" transform="translate(78 610)"/>
  <use href="#cafe" transform="translate(183 600)"/>
  <path d="M70 675h44m18 0h65m36 0h65m18 0h44" class="line"/>
  <path d="M114 675l8-9m10 9-8-9m174 9 8-9m10 9-8-9" class="thin"/>
  <text x="115" y="707" text-anchor="middle" class="label">DEPARTURES</text>
  <text x="298" y="707" text-anchor="middle" class="label">ARRIVALS</text>

  <!-- NOW: walkway and gates -->
  <rect x="175" y="335" width="80" height="150" class="line"/>
  <use href="#walkway" transform="translate(215 425)"/>
  <use href="#walkway" transform="translate(215 370)"/>
  <text x="158" y="472" class="gate">1</text>
  <text x="158" y="430" class="gate">2</text>
  <text x="158" y="386" class="gate">3</text>
  <text x="184" y="323" class="gate">4</text>
  <text x="231" y="323" class="gate">5</text>
  <text x="267" y="386" class="gate">6</text>
  <text x="267" y="430" class="gate">7</text>
  <text x="267" y="472" class="gate">8</text>

  <!-- AFTER: terminal -->
  <rect x="490" y="485" width="320" height="190" class="line"/>
  <line x1="650" y1="485" x2="650" y2="675" class="line"/>
  <line x1="490" y1="535" x2="810" y2="535" class="thin"/>
  <line x1="490" y1="570" x2="810" y2="570" class="thin"/>
  <text x="495" y="508" class="small">SECURITY</text>
  <text x="495" y="558" class="small">PASSPORT CONTROL</text>
  <text x="657" y="508" class="small">PASSPORT CONTROL</text>
  <text x="657" y="558" class="small">CUSTOMS</text>
  <use href="#bagdrop" transform="translate(515 610)"/>
  <use href="#checkin" transform="translate(620 610)"/>
  <use href="#cafe" transform="translate(515 650)"/>
  <use href="#cafe" transform="translate(775 590)"/>
  <use href="#atm" transform="translate(775 635)"/>
  <path d="M505 675h44m18 0h65m36 0h65m18 0h44" class="line"/>
  <path d="M549 675l8-9m10 9-8-9m174 9 8-9m10 9-8-9" class="thin"/>
  <text x="550" y="707" text-anchor="middle" class="label">DEPARTURES</text>
  <text x="733" y="707" text-anchor="middle" class="label">ARRIVALS</text>

  <!-- shops and car hire -->
  <path d="M490 485l115-72h45v72z" fill="#fff" stroke="#222" stroke-width="2.1"/>
  <text x="550" y="456" transform="rotate(-31 550 456)" class="label">SHOPS</text>
  <rect x="810" y="620" width="58" height="55" class="line"/>
  <use href="#car" transform="translate(839 647) scale(.8)"/>

  <!-- AFTER: central corridor and sky train -->
  <rect x="625" y="280" width="50" height="205" class="line"/>
  <use href="#train" transform="translate(650 438)"/>
  <use href="#train" transform="translate(650 305)"/>
  <text x="608" y="470" class="gate">1</text>
  <text x="608" y="428" class="gate">2</text>
  <text x="608" y="386" class="gate">3</text>
  <text x="682" y="386" class="gate">16</text>
  <text x="682" y="428" class="gate">17</text>
  <text x="682" y="470" class="gate">18</text>

  <!-- AFTER: branched gate concourse -->
  <path d="M625 280L542 205L585 150L650 210L715 150L758 205L675 280" class="line"/>
  <line x1="650" y1="210" x2="650" y2="280" class="line"/>
  <text x="590" y="270" class="gate">4</text>
  <text x="570" y="245" class="gate">5</text>
  <text x="550" y="219" class="gate">6</text>
  <text x="542" y="177" class="gate">7</text>
  <text x="587" y="141" class="gate">8</text>
  <text x="612" y="177" class="gate">9</text>
  <text x="686" y="177" class="gate">10</text>
  <text x="715" y="141" class="gate">11</text>
  <text x="760" y="177" class="gate">12</text>
  <text x="770" y="219" class="gate">13</text>
  <text x="750" y="245" class="gate">14</text>
  <text x="730" y="270" class="gate">15</text>

  <!-- NOW legend -->
  <rect x="130" y="755" width="205" height="110" class="line"/>
  <use href="#checkin" transform="translate(155 778) scale(.72)"/>
  <text x="185" y="783" class="label">Check-in</text>
  <use href="#cafe" transform="translate(155 808) scale(.72)"/>
  <text x="185" y="813" class="label">Café</text>
  <use href="#walkway" transform="translate(155 838) scale(.72)"/>
  <text x="185" y="843" class="label">Walkway</text>
  <rect x="143" y="850" width="32" height="18" rx="8" fill="#fff" stroke="#222" stroke-width="1.3"/>
  <text x="159" y="864" text-anchor="middle" class="small">1–8</text>
  <text x="185" y="865" class="label">Gates</text>

  <!-- AFTER legend -->
  <rect x="545" y="735" width="220" height="150" class="line"/>
  <use href="#checkin" transform="translate(570 758) scale(.72)"/>
  <text x="600" y="763" class="label">Check-in</text>
  <use href="#bagdrop" transform="translate(570 786) scale(.72)"/>
  <text x="600" y="791" class="label">Bag drop</text>
  <use href="#cafe" transform="translate(570 814) scale(.72)"/>
  <text x="600" y="819" class="label">Café</text>
  <use href="#atm" transform="translate(570 842) scale(.72)"/>
  <text x="600" y="847" class="label">ATM</text>
  <use href="#train" transform="translate(690 758) scale(.72)"/>
  <text x="720" y="763" class="label">Sky train</text>
  <use href="#car" transform="translate(690 786) scale(.62)"/>
  <text x="720" y="791" class="label">Car hire</text>
  <rect x="678" y="807" width="38" height="18" rx="8" fill="#fff" stroke="#222" stroke-width="1.3"/>
  <text x="697" y="821" text-anchor="middle" class="small">1–18</text>
  <text x="720" y="822" class="label">Gates</text>
</svg>